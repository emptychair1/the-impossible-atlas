  while(head<tail){const i=queue[head++],x=i%w,y=(i/w)|0;area++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);
   for(let dy=-1;dy<=1;dy++){const ny=y+dy;if(ny<0||ny>=h)continue;for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx;if(nx<0||nx>=w)continue;const ni=ny*w+nx;if(!labels[ni]&&pixels[ni*4+3]>threshold){labels[ni]=label;queue[tail++]=ni}}}

 const order=new Uint16Array(label+1);components.forEach((c,i)=>order[c.label]=i+1);
 for(let i=0;i<count;i++)labels[i]=order[labels[i]]||0;
 const additions=new Uint16Array(count);

 for(let i=0;i<count;i++){const owner=labels[i];if(!owner)continue;const x=i%w,y=(i/w)|0,b=bounds[owner-1];b.minX=Math.min(b.minX,x);b.maxX=Math.max(b.maxX,x);b.minY=Math.min(b.minY,y);b.maxY=Math.max(b.maxY,y)}

 for(let y=b.minY;y<=b.maxY;y++)for(let x=b.minX;x<=b.maxX;x++){const si=y*w+x;if(labels[si]!==index+1)continue;const so=si*4,to=((y-b.minY)*fw+x-b.minX)*4;for(let k=0;k<4;k++)fd.data[to+k]=pixels[so+k]}

const crowdRandom=n=>{const x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};
const pedestrians=Array.from({length:30},(_,i)=>({type:i%5,phase:(i+crowdRandom(i+31)*.72)/30,speed:19+crowdRandom(i+71)*24,step:crowdRandom(i+111)*8,flip:i%5===4}));
let crowdTextures=Array.from({length:5},()=>[]),crowdActors=[],lightFields=[];
const ROOT='assets/tokyo-scenes/';
const scenes=[ROOT+'FFC4A81F-57E3-4153-8242-4DBB5DF6AAF4.png',ROOT+'745F0F74-D425-4FFD-8E82-FD3DA2F35910.png'];
let game,world,glows=[],sceneImages=[],flickerLights=[],travel=0,move=0,luminosity=1,viewport={w:innerWidth,h:innerHeight};

function makeEmission(scene,key){
 const source=scene.textures.get(key).getSourceImage(),w=source.width,h=source.height;
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
 const c=canvas.getContext('2d',{willReadFrequently:true});c.drawImage(source,0,0);
 const pixels=c.getImageData(0,0,w,h),d=pixels.data;
 for(let i=0;i<d.length;i+=4){
  const r=d[i],g=d[i+1],b=d[i+2],peak=Math.max(r,g,b),chroma=peak-Math.min(r,g,b);

  d[i+3]=Math.round(230*Math.max(0,Math.min(1,intensity)));

 c.putImageData(pixels,0,0);

}
// One shared, world-anchored lighting calculation for pedestrians and protagonist.
function sampleNeon(worldX,worldY,sizes,height){
 let offset=0,fieldIndex=-1;
 for(let i=0;i<sizes.length;i++){if(worldX>=offset&&worldX<offset+sizes[i]){fieldIndex=i;break}offset+=sizes[i]}
 if(fieldIndex<0)return {color:[0,0,0],strength:0};
 const field=lightFields[fieldIndex],cx=Math.round((worldX-offset)/sizes[fieldIndex]*(field.width-1));

 let best=0,rr=0,gg=0,bb=0;
 for(let dy=-16;dy<=16;dy+=2)for(let dx=-20;dx<=20;dx+=2){
  const xx=cx+dx,yy=cy+dy;if(xx<0||yy<0||xx>=field.width||yy>=field.height)continue;
  const k=(yy*field.width+xx)*4,r=field.data[k],g=field.data[k+1],b=field.data[k+2];
  const peak=Math.max(r,g,b),floor=Math.min(r,g,b),chroma=peak-floor;
  const saturation=chroma/Math.max(1,peak),bright=Math.max(0,Math.min(1,(peak-145)/90));

function smoothLight(target,sample,dt){

  target.glowStrength+=(sample.strength-target.glowStrength)*easing;
  target.glowColor.forEach((v,i)=>target.glowColor[i]+=(sample.color[i]-v)*easing);
 }else{
  target.strength+=(sample.strength-target.strength)*easing;
  target.color.forEach((v,i)=>target.color[i]+=(sample.color[i]-v)*easing);
 }
}
class Lab extends Phaser.Scene{
 constructor(){super('Lab')}
 preload(){scenes.forEach((path,i)=>this.load.image('scene'+i,path));CROWD_PATHS.forEach((path,i)=>this.load.image('crowd'+i,path));this.load.image('hero-sheet',HERO_PATH)}
 create(){
  this.cameras.main.setBackgroundColor('#02050b');
  scenes.forEach((_,i)=>{
   const key='scene'+i;makeEmission(this,key);
   // Precompute a compact emissive color field once, never read pixels during rendering.
   const src=this.textures.get(key).getSourceImage(),field=document.createElement('canvas');
   field.width=180;field.height=Math.round(180*src.height/src.width);
   const fg=field.getContext('2d',{willReadFrequently:true});fg.drawImage(src,0,0,field.width,field.height);
   lightFields.push({width:field.width,height:field.height,data:fg.getImageData(0,0,field.width,field.height).data});
   const original=this.add.image(0,0,key).setOrigin(0);
   const emission=this.add.image(0,0,key+'-emission').setOrigin(0).setBlendMode(Phaser.BlendModes.ADD);
   // Phaser's WebGL post-processing bloom keeps the original scene unfiltered and legible.
   if(emission.postFX&&emission.postFX.addBloom){
    const bloom=emission.postFX.addBloom(0xffffff,1,1,2,1.1);
    glows.push({emission,bloom});
   }else{
    glows.push({emission,bloom:null});
    status.textContent='WebGL bloom unavailable: showing emission only';
   }
   sceneImages.push({original,emission});
   // A few independent neon fixtures, anchored to actual saturated emissive pixels.
   // Their source art remains untouched; only the bloom contribution fluctuates.
   const pixels=fg.getImageData(0,0,field.width,field.height).data;
   // Four isolated real emissive pixels across the two original scenes.
   // Preserve the first approved fixture and add three spatially separated bulbs.
   const candidates=[];
   for(let y=10;y<field.height*.65;y+=2)for(let x=10;x<field.width-10;x+=2){
    const k=(y*field.width+x)*4,r=pixels[k],g=pixels[k+1],b=pixels[k+2];
    const peak=Math.max(r,g,b),chroma=peak-Math.min(r,g,b);
    if(peak>185&&chroma>95)candidates.push({x,y,score:peak+chroma});
   }
   candidates.sort((a,b)=>b.score-a.score);
   const count=i===0?2:2;
   const chosen=[];
   for(const c of candidates){
    if(chosen.every(s=>Math.hypot(s.x-c.x,s.y-c.y)>field.width*.34)){
     chosen.push(c);if(chosen.length===count)break;
    }
   }
   chosen.forEach((c,j)=>{
    const id=i*2+j,radius=3,clip=document.createElement('canvas');
    clip.width=radius*2;clip.height=radius*2;
    const cg=clip.getContext('2d');
    const source=this.textures.get(key+'-emission').getSourceImage();
    const sx=c.x/field.width*src.width,sy=c.y/field.height*src.height;
    const sw=radius*2/field.width*src.width,sh=radius*2/field.height*src.height;
    cg.drawImage(source,sx-sw/2,sy-sh/2,sw,sh,0,0,clip.width,clip.height);
    const tex='single-flicker-bulb-'+id;this.textures.addCanvas(tex,clip);
    const lamp=this.add.image(0,0,tex).setOrigin(.5).setBlendMode(Phaser.BlendModes.ADD).setDepth(3);
    if(lamp.postFX?.addBloom)lamp.postFX.addBloom(0xffffff,1,1,2,.65);
    flickerLights.push({lamp,sceneIndex:i,x:c.x/field.width,y:c.y/field.height,radius,id});
   });
  });
  CROWD_PATHS.forEach((_,i)=>{
   const source=this.textures.get('crowd'+i).getSourceImage();
   const extracted=extractPedestrianFrames(source);
   extracted.forEach((frame,j)=>{const key='walker-'+i+'-'+j;this.textures.addCanvas(key,frame.image);crowdTextures[i].push({...frame,key})});
  });
  const heroSource=this.textures.get('hero-sheet').getSourceImage();
  heroFrames=extractSpriteFrames(heroSource);
  heroFrames.forEach((frame,i)=>{const key='hero-frame-'+i;this.textures.addCanvas(key,frame.image);frame.key=key});
  if(heroFrames.length){
   heroActor=this.add.image(0,0,heroFrames[1].key).setOrigin(0,0).setDepth(20);
   heroLight=this.add.image(0,0,heroFrames[1].key).setOrigin(0,0).setDepth(21).setAlpha(0);
  }
  pedestrians.forEach(p=>{
   const f=crowdTextures[p.type][0];if(!f)return;
   const actor=this.add.image(0,0,f.key).setOrigin(0,0).setDepth(20);
   actor.setAlpha(1);
   crowdActors.push({p,actor,glowStrength:0,glowColor:[0,0,0]});
  });
  this.scale.on('resize',size=>{viewport={w:size.width,h:size.height}});
  status.textContent=glows.every(g=>g.bloom)?'Phaser WebGL bloom active · original art preserved':'Phaser running · bloom unavailable';

 update(time,dt){
  const h=this.scale.height,w=this.scale.width;
  const sizes=sceneImages.map(pair=>pair.original.width*h/pair.original.height);

  if(move)walkClock+=dt*.01;
  let x=-travel;
  sceneImages.forEach((pair,i)=>{
   for(const image of [pair.original,pair.emission])image.setPosition(x,0).setDisplaySize(sizes[i],h);
   x+=sizes[i];
  });
  glows.forEach(g=>{g.emission.setAlpha(Math.min(1,.53*luminosity));if(g.bloom)g.bloom.strength=1.1*luminosity});

   }else if(f.id===2){
    const cycle=t%29.7;

   }else{
    const cycle=t%37.1;
    if(cycle>31.4&&cycle<31.52)intensity=.035;
   }
   f.lamp.setPosition(left+f.x*span,f.y*h)
    .setDisplaySize(f.radius*2/180*span,f.radius*2/lightFields[f.sceneIndex].height*h)
    .setAlpha(intensity*luminosity);
  });
  const heroHeight=Math.max(81.648,Math.min(161.595,h*.1828575)),feetY=h*.845+18,t=time*.001;
  if(heroActor&&heroFrames.length){
   const frame=heroFrames[move?Math.floor(walkClock)%heroFrames.length:1];
   const scale=heroHeight/390,heroX=Math.min(w*.4,w-74);
   const px=heroX-frame.anchorX*scale,py=feetY-frame.anchorY*scale;
   heroActor.setTexture(frame.key).setPosition(px,py)
    .setDisplaySize(frame.width*scale,frame.height*scale).setFlipX(move<0);
   heroLight.setTexture(frame.key).setPosition(px,py)
    .setDisplaySize(frame.width*scale,frame.height*scale).setFlipX(move<0);
   const sample=sampleNeon(heroX+travel,feetY-heroHeight*.8,sizes,h);
   smoothLight(heroLighting,sample,dt);
   heroLight.setTint(Phaser.Display.Color.GetColor(...heroLighting.color.map(Math.round)))
    .setAlpha(heroLighting.strength*.7);
  }
  crowdActors.forEach(entry=>{const {p,actor}=entry;
   const frames=crowdTextures[p.type],f=frames[Math.floor(t*(6.5+p.speed*.025)+p.step)%frames.length];
   const range=w+heroHeight*2,worldTravel=t*p.speed+p.phase*range+(p.flip?travel:-travel),progress=((worldTravel%range)+range)%range;
   const x=p.flip?w+heroHeight-progress:progress-heroHeight,scale=heroHeight*1.15/Math.max(1,f.height);
   const px=x-f.anchorX*scale,py=feetY-f.anchorY*scale;
   // Stable per-walker depth: alternate near and far lanes without changing approved paths.
   // The hero remains at depth 20/21; near-lane walkers occlude him, far-lane walkers pass behind.
   const near=p.type===3||p.type===4||pedestrians.indexOf(p)%3===0;
   actor.setDepth(near?22:18);
   actor.setTexture(f.key).setPosition(px,py).setDisplaySize(f.width*scale,f.height*scale);
   const sample=sampleNeon(x+travel,feetY-heroHeight*.8,sizes,h);
   smoothLight(entry,sample,dt);
   // Single opaque sprite, no transparent duplicate. Modulate the dark silhouette
   // toward the local neon hue while retaining its alpha and frame boundaries.
   const strength=Math.min(.62,entry.glowStrength);
   const base=(p.type===3||p.type===4)?65:91;
   const [r,g,b]=entry.glowColor;
   const color=Phaser.Display.Color.GetColor(
    Math.min(255,Math.round(base+r*strength*.62)),
    Math.min(255,Math.round(base+g*strength*.62)),
    Math.min(255,Math.round(base+b*strength*.62))
   );
   actor.setTint(color).setAlpha(1);
  });
