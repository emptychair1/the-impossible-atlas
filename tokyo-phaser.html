<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Tokyo · Phaser Lighting Lab</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;color:#f7e7c5;font-family:system-ui}#lab{width:100%;height:100%;touch-action:none}.badge{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:12px;font-size:11px;letter-spacing:.12em;pointer-events:none}.controls{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 12px);left:12px;right:12px;display:flex;gap:8px;align-items:center;justify-content:center;background:#060b17b8;padding:10px;border-radius:12px}.controls button{background:#20344b;color:white;border:1px solid #7185a1;border-radius:8px;padding:9px 14px}.controls input{width:100px}.status{position:fixed;top:calc(env(safe-area-inset-top) + 32px);left:12px;font-size:11px;color:#f3d29b}</style></head><body><div id="lab"></div><div class="badge">THE IMPOSSIBLE ATLAS · PHASER LIGHTING LAB · V32</div><div class="status" id="status">Loading Phaser…</div><div class="controls"><button id="left">◀</button><button id="right">▶</button><label>Bloom <input id="strength" type="range" min="0" max="2" step=".05" value="1"></label></div>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
const HERO_PATH='assets/tokyo-scenes/9E8C5BA0-F636-4EF0-9E4F-FDF7908A3827.png';
function extractSpriteFrames(image){
const source=document.createElement('canvas');source.width=image.naturalWidth;source.height=image.naturalHeight;const sc=source.getContext('2d',{willReadFrequently:true});sc.drawImage(image,0,0);const pixels=sc.getImageData(0,0,source.width,source.height).data;const w=source.width,h=source.height,count=w*h,labels=new Uint16Array(count),queue=new Uint32Array(count),components=[];const threshold=32;let label=0;
for(let start=0;start<count;start++){if(labels[start]||pixels[start*4+3]<=threshold)continue;label++;let head=0,tail=0,area=0,minX=w,minY=h,maxX=0,maxY=0;labels[start]=label;queue[tail++]=start;
while(head<tail){const i=queue[head++],x=i%w,y=(i/w)|0;area++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);for(let dy=-1;dy<=1;dy++){const ny=y+dy;if(ny<0||ny>=h)continue;for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx;if(nx<0||nx>=w)continue;const ni=ny*w+nx;if(!labels[ni]&&pixels[ni*4+3]>threshold){labels[ni]=label;queue[tail++]=ni}}}}if(area>10000)components.push({label,minX,minY,maxX,maxY})}
components.sort((a,b)=>(a.minY<h/2?0:1)-(b.minY<h/2?0:1)||a.minX-b.minX);if(components.length!==16){console.error('Expected 16 figures, found',components.length);return []}
const order=new Uint16Array(label+1);components.forEach((c,i)=>order[c.label]=i+1);for(let i=0;i<count;i++)labels[i]=order[labels[i]]||0;
const additions=new Uint16Array(count);for(let pass=0;pass<6;pass++){additions.fill(0);for(let i=0;i<count;i++){if(labels[i]||!pixels[i*4+3])continue;const x=i%w,y=(i/w)|0;let owner=0,conflict=false;for(let dy=-1;dy<=1&&!conflict;dy++){const ny=y+dy;if(ny<0||ny>=h)continue;for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx;if(nx<0||nx>=w)continue;const near=labels[ny*w+nx];if(!near)continue;if(owner&&owner!==near){conflict=true;break}owner=near}}if(owner&&!conflict)additions[i]=owner}for(let i=0;i<count;i++)if(additions[i])labels[i]=additions[i]}
const bounds=Array.from({length:16},()=>({minX:w,minY:h,maxX:0,maxY:0}));for(let i=0;i<count;i++){const owner=labels[i];if(!owner)continue;const x=i%w,y=(i/w)|0,b=bounds[owner-1];b.minX=Math.min(b.minX,x);b.maxX=Math.max(b.maxX,x);b.minY=Math.min(b.minY,y);b.maxY=Math.max(b.maxY,y)}
return bounds.map((b,frameIndex)=>{const fw=b.maxX-b.minX+1,fh=b.maxY-b.minY+1,fc=document.createElement('canvas');fc.width=fw;fc.height=fh;const fx=fc.getContext('2d'),fd=fx.createImageData(fw,fh);let weight=0,hoodX=0;for(let y=b.minY;y<=b.maxY;y++)for(let x=b.minX;x<=b.maxX;x++){const si=y*w+x;if(labels[si]!==frameIndex+1)continue;const so=si*4,to=((y-b.minY)*fw+x-b.minX)*4;for(let k=0;k<4;k++)fd.data[to+k]=pixels[so+k];if(y<=b.minY+fh*.28&&pixels[so+3]>threshold){hoodX+=(x-b.minX)*pixels[so+3];weight+=pixels[so+3]}}fx.putImageData(fd,0,0);return{image:fc,width:fw,height:fh,anchorX:weight?hoodX/weight:fw/2,anchorY:fh}})}

let heroFrames=[],heroActor=null,walkClock=0;
const CROWD_PATHS=["assets/umbrella-commuter.png","assets/phone-walker.png","assets/briefcase-commuter.png","assets/umbrella-couple.png","assets/umbrella-woman.png"];
function extractPedestrianFrames(image){
 // Identical connected-alpha component isolation as the hero, generalized to eight frames.
 const w=image.naturalWidth,h=image.naturalHeight,source=document.createElement('canvas');source.width=w;source.height=h;
 const sc=source.getContext('2d',{willReadFrequently:true});sc.drawImage(image,0,0);
 const pixels=sc.getImageData(0,0,w,h).data,count=w*h,labels=new Uint16Array(count),queue=new Uint32Array(count),components=[];
 let label=0;const threshold=32;
 for(let start=0;start<count;start++){
  if(labels[start]||pixels[start*4+3]<=threshold)continue;
  label++;let head=0,tail=0,area=0,minX=w,minY=h,maxX=0,maxY=0;labels[start]=label;queue[tail++]=start;
  while(head<tail){const i=queue[head++],x=i%w,y=(i/w)|0;area++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);
   for(let dy=-1;dy<=1;dy++){const ny=y+dy;if(ny<0||ny>=h)continue;for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx;if(nx<0||nx>=w)continue;const ni=ny*w+nx;if(!labels[ni]&&pixels[ni*4+3]>threshold){labels[ni]=label;queue[tail++]=ni}}}
  }
  if(area>Math.max(200,w*h*.0005))components.push({label,minX,minY,maxX,maxY,area});
 }
 components.sort((a,b)=>a.minY-b.minY||a.minX-b.minX);
 if(components.length!==8){console.warn('Pedestrian sprite must contain eight separate transparent figures; found',components.length,image.src);return []}
 const order=new Uint16Array(label+1);components.forEach((c,i)=>order[c.label]=i+1);
 for(let i=0;i<count;i++)labels[i]=order[labels[i]]||0;
 const additions=new Uint16Array(count);
 for(let pass=0;pass<6;pass++){additions.fill(0);for(let i=0;i<count;i++){if(labels[i]||!pixels[i*4+3])continue;const x=i%w,y=(i/w)|0;let owner=0,conflict=false;for(let dy=-1;dy<=1&&!conflict;dy++){const ny=y+dy;if(ny<0||ny>=h)continue;for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx;if(nx<0||nx>=w)continue;const near=labels[ny*w+nx];if(!near)continue;if(owner&&owner!==near){conflict=true;break}owner=near}}if(owner&&!conflict)additions[i]=owner}for(let i=0;i<count;i++)if(additions[i])labels[i]=additions[i]}
 const bounds=Array.from({length:8},()=>({minX:w,minY:h,maxX:0,maxY:0}));
 for(let i=0;i<count;i++){const owner=labels[i];if(!owner)continue;const x=i%w,y=(i/w)|0,b=bounds[owner-1];b.minX=Math.min(b.minX,x);b.maxX=Math.max(b.maxX,x);b.minY=Math.min(b.minY,y);b.maxY=Math.max(b.maxY,y)}
 return bounds.map((b,index)=>{const fw=b.maxX-b.minX+1,fh=b.maxY-b.minY+1,fc=document.createElement('canvas');fc.width=fw;fc.height=fh;const fx=fc.getContext('2d'),fd=fx.createImageData(fw,fh);
 for(let y=b.minY;y<=b.maxY;y++)for(let x=b.minX;x<=b.maxX;x++){const si=y*w+x;if(labels[si]!==index+1)continue;const so=si*4,to=((y-b.minY)*fw+x-b.minX)*4;for(let k=0;k<4;k++)fd.data[to+k]=pixels[so+k]}
 fx.putImageData(fd,0,0);return{image:fc,width:fw,height:fh,anchorX:fw/2,anchorY:fh}});
}

const crowdRandom=n=>{const x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};
const pedestrians=Array.from({length:30},(_,i)=>({type:i%5,phase:(i+crowdRandom(i+31)*.72)/30,speed:19+crowdRandom(i+71)*24,step:crowdRandom(i+111)*8,flip:i%5===4}));
let crowdTextures=Array.from({length:5},()=>[]),crowdActors=[],lightFields=[];
const ROOT='assets/tokyo-scenes/';
const scenes=[ROOT+'FFC4A81F-57E3-4153-8242-4DBB5DF6AAF4.png',ROOT+'745F0F74-D425-4FFD-8E82-FD3DA2F35910.png'];
let game,world,glows=[],sceneImages=[],travel=0,move=0,luminosity=1,viewport={w:innerWidth,h:innerHeight};
const status=document.getElementById('status');
function makeEmission(scene,key){
 const source=scene.textures.get(key).getSourceImage(),w=source.width,h=source.height;
 const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
 const c=canvas.getContext('2d',{willReadFrequently:true});c.drawImage(source,0,0);
 const pixels=c.getImageData(0,0,w,h),d=pixels.data;
 for(let i=0;i<d.length;i+=4){
  const r=d[i],g=d[i+1],b=d[i+2],peak=Math.max(r,g,b),chroma=peak-Math.min(r,g,b);
  const lum=.2126*r+.7152*g+.0722*b;
  const intensity=Math.max((lum-168)/65,(peak-175)/80*Math.min(1,chroma/80));
  d[i+3]=Math.round(230*Math.max(0,Math.min(1,intensity)));
 }
 c.putImageData(pixels,0,0);
 scene.textures.addCanvas(key+'-emission',canvas);
}
class Lab extends Phaser.Scene{
 constructor(){super('Lab')}
 preload(){scenes.forEach((path,i)=>this.load.image('scene'+i,path));CROWD_PATHS.forEach((path,i)=>this.load.image('crowd'+i,path));this.load.image('hero-sheet',HERO_PATH)}
 create(){
  this.cameras.main.setBackgroundColor('#02050b');
  scenes.forEach((_,i)=>{
   const key='scene'+i;makeEmission(this,key);
   // Precompute a compact emissive color field once, never read pixels during rendering.
   const src=this.textures.get(key).getSourceImage(),field=document.createElement('canvas');
   field.width=180;field.height=Math.round(180*src.height/src.width);
   const fg=field.getContext('2d',{willReadFrequently:true});fg.drawImage(src,0,0,field.width,field.height);
   lightFields.push({width:field.width,height:field.height,data:fg.getImageData(0,0,field.width,field.height).data});
   const original=this.add.image(0,0,key).setOrigin(0);
   const emission=this.add.image(0,0,key+'-emission').setOrigin(0).setBlendMode(Phaser.BlendModes.ADD);
   // Phaser's WebGL post-processing bloom keeps the original scene unfiltered and legible.
   if(emission.postFX&&emission.postFX.addBloom){
    const bloom=emission.postFX.addBloom(0xffffff,1,1,2,1.1);
    glows.push({emission,bloom});
   }else{
    glows.push({emission,bloom:null});
    status.textContent='WebGL bloom unavailable: showing emission only';
   }
   sceneImages.push({original,emission});
  });
  CROWD_PATHS.forEach((_,i)=>{
   const source=this.textures.get('crowd'+i).getSourceImage();
   const extracted=extractPedestrianFrames(source);
   extracted.forEach((frame,j)=>{const key='walker-'+i+'-'+j;this.textures.addCanvas(key,frame.image);crowdTextures[i].push({...frame,key})});
  });
  const heroSource=this.textures.get('hero-sheet').getSourceImage();
  heroFrames=extractSpriteFrames(heroSource);
  heroFrames.forEach((frame,i)=>{const key='hero-frame-'+i;this.textures.addCanvas(key,frame.image);frame.key=key});
  if(heroFrames.length)heroActor=this.add.image(0,0,heroFrames[1].key).setOrigin(0,0).setDepth(30);
  pedestrians.forEach(p=>{
   const f=crowdTextures[p.type][0];if(!f)return;
   const actor=this.add.image(0,0,f.key).setOrigin(0,0).setDepth(20);
   if(p.type===3||p.type===4)actor.setTint(0x808080);
   const light=this.add.image(0,0,f.key).setOrigin(0,0).setDepth(21).setAlpha(0);
   crowdActors.push({p,actor,light,glowStrength:0,glowColor:[0,0,0]});
  });
  this.scale.on('resize',size=>{viewport={w:size.width,h:size.height}});
  status.textContent=glows.every(g=>g.bloom)?'Phaser WebGL bloom active · original art preserved':'Phaser running · bloom unavailable';
 }
 update(time,dt){
  const h=this.scale.height,w=this.scale.width;
  const sizes=sceneImages.map(pair=>pair.original.width*h/pair.original.height);
  const total=sizes.reduce((a,b)=>a+b,0);
  travel=Phaser.Math.Clamp(travel+move*Math.max(165,Math.min(230,h*.24))*dt/1000,0,Math.max(0,total-w));
  if(move)walkClock+=dt*.01;
  let x=-travel;
  sceneImages.forEach((pair,i)=>{
   for(const image of [pair.original,pair.emission])image.setPosition(x,0).setDisplaySize(sizes[i],h);
   x+=sizes[i];
  });
  glows.forEach(g=>{g.emission.setAlpha(Math.min(1,.6*luminosity));if(g.bloom)g.bloom.strength=1.1*luminosity});
  const heroHeight=Math.max(81.648,Math.min(161.595,h*.1828575)),feetY=h*.845+18,t=time*.001;
  if(heroActor&&heroFrames.length){
   const frame=heroFrames[move?Math.floor(walkClock)%heroFrames.length:1];
   const scale=heroHeight/390,heroX=Math.min(w*.4,w-74);
   heroActor.setTexture(frame.key).setPosition(heroX-frame.anchorX*scale,feetY-frame.anchorY*scale)
    .setDisplaySize(frame.width*scale,frame.height*scale).setFlipX(move<0);
  }
  crowdActors.forEach(entry=>{const {p,actor,light}=entry;
   const frames=crowdTextures[p.type],f=frames[Math.floor(t*(6.5+p.speed*.025)+p.step)%frames.length];
   const range=w+heroHeight*2,worldTravel=t*p.speed+p.phase*range+(p.flip?travel:-travel),progress=((worldTravel%range)+range)%range;
   const x=p.flip?w+heroHeight-progress:progress-heroHeight,scale=heroHeight*1.15/Math.max(1,f.height);
   const px=x-f.anchorX*scale,py=feetY-f.anchorY*scale;
   actor.setTexture(f.key).setPosition(px,py).setDisplaySize(f.width*scale,f.height*scale);
   light.setTexture(f.key).setPosition(px,py).setDisplaySize(f.width*scale,f.height*scale);
   // Sample luminous architecture near the walker's upper body, with a broad falloff.
   const worldX=x+travel;let offset=0,fieldIndex=-1;
   for(let i=0;i<sizes.length;i++){if(worldX>=offset&&worldX<offset+sizes[i]){fieldIndex=i;break}offset+=sizes[i]}
   if(fieldIndex<0){entry.glowStrength*=.92;light.setAlpha(entry.glowStrength);return}
   const field=lightFields[fieldIndex],cx=Math.round((worldX-offset)/sizes[fieldIndex]*(field.width-1));
   const cy=Math.round((feetY-heroHeight*.8)/h*(field.height-1));
   // Select the strongest nearby emissive color rather than averaging it into blue ambient.
   // Wider sampling lets warm storefronts illuminate walkers before they reach the sign.
   let best=0,rr=0,gg=0,bb=0;
   for(let dy=-16;dy<=16;dy+=2)for(let dx=-20;dx<=20;dx+=2){
    const xx=cx+dx,yy=cy+dy;if(xx<0||yy<0||xx>=field.width||yy>=field.height)continue;
    const k=(yy*field.width+xx)*4,r=field.data[k],g=field.data[k+1],b=field.data[k+2];
    const peak=Math.max(r,g,b),floor=Math.min(r,g,b),chroma=peak-floor;
    const lum=.2126*r+.7152*g+.0722*b;
    const saturation=chroma/Math.max(1,peak);
    const bright=Math.max(0,Math.min(1,(peak-145)/90));
    const warm=(r>b*1.14&&r>g*.88)?1.9:1;
    const falloff=1/(1+(dx*dx+dy*dy)/125);
    const score=bright*Math.pow(saturation,1.3)*falloff*warm;
    if(score>best){best=score;rr=r;gg=g;bb=b}
   }
   // Keep hue saturated: an additive sprite layer should read as colored light, not gray.
   const floor=Math.min(rr,gg,bb),peak=Math.max(rr,gg,bb);
   const vivid=peak>0?255/peak:0;
   const tintR=Math.max(0,Math.min(255,Math.round((rr-floor*.55)*vivid)));
   const tintG=Math.max(0,Math.min(255,Math.round((gg-floor*.55)*vivid)));
   const tintB=Math.max(0,Math.min(255,Math.round((bb-floor*.55)*vivid)));
   const intensity=Math.min(.65,best*1.65)*luminosity;
   // Smooth changes between frames to prevent neon flicker as sampling crosses pixel clusters.
   const easing=1-Math.exp(-Math.min(dt,50)/170);
   entry.glowStrength+=(intensity-entry.glowStrength)*easing;
   entry.glowColor[0]+=(tintR-entry.glowColor[0])*easing;
   entry.glowColor[1]+=(tintG-entry.glowColor[1])*easing;
   entry.glowColor[2]+=(tintB-entry.glowColor[2])*easing;
   // Normal compositing keeps the original pedestrian opaque; the second layer
   // is only a subtle tint, never a translucent additive duplicate.
   light.setTint(Phaser.Display.Color.GetColor(...entry.glowColor.map(Math.round))).setAlpha(entry.glowStrength);
  });
 }
}
if(!window.Phaser){status.textContent='Phaser could not load';}
else{game=new Phaser.Game({type:Phaser.WEBGL,parent:'lab',backgroundColor:'#02050b',scale:{mode:Phaser.Scale.RESIZE,width:innerWidth,height:innerHeight},render:{pixelArt:false,antialias:true},scene:[Lab]});}
function hold(id,value){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{move=value;el.setPointerCapture(e.pointerId)});el.addEventListener('pointerup',()=>move=0);el.addEventListener('pointercancel',()=>move=0)}
hold('left',-1);hold('right',1);
document.getElementById('strength').addEventListener('input',e=>luminosity=Number(e.target.value));
addEventListener('keydown',e=>{if(e.key==='ArrowRight')move=1;if(e.key==='ArrowLeft')move=-1});
addEventListener('keyup',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft')move=0});
</script></body></html>
