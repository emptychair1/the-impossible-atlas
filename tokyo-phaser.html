function sampleNeon(worldX,worldY,sizes,height){

 for(let dy=-16;dy<=16;dy+=2)for(let dx=-20;dx<=20;dx+=2){
  const xx=cx+dx,yy=cy+dy;if(xx<0||yy<0||xx>=field.width||yy>=field.height)continue;

    this.officeScroll.setVisible(true).setPosition(-this.officeDistance,h/2).setDisplaySize(worldWidth,worldHeight);
    // Enter from beyond the left edge, then settle into the scrolling follow position.
    if(this.officeEntryX===null)this.officeEntryX=-w*.16;
    const followX=w*.48;
    const advance=this.terminalOpen?0:move>0?dt*.22:move<0?-dt*.22:0;
    const entryStop=Math.max(-w*.16,Math.min(followX,terminalWorldX-this.officeDistance-w*.15));
    this.officeEntryX=Phaser.Math.Clamp(this.officeEntryX+advance,-w*.16,entryStop);
    const heroX=this.officeEntryX,heroY=h*.88;
    // Terminal is a separate sprite, anchored to the office world rather than the camera.
    const terminalX=worldWidth*.78-this.officeDistance;
    const terminalHeight=h*.195;
    const terminalSource=this.textures.get('piper-crt').getSourceImage();
    this.piperTerminal.setVisible(true).setPosition(terminalX,h*.82)
     .setDisplaySize(terminalHeight*terminalSource.width/terminalSource.height,terminalHeight);
    this.piperGlow.setVisible(true).setPosition(terminalX,h*.705)
     .setDisplaySize(w*.30,h*.19).setAlpha(.30+.035*Math.sin(time*.004));
    const lights=[.165,.37,.635,.865];
    let illumination=0;
    lights.forEach((x,i)=>{
     const lampX=x*worldWidth-this.officeDistance;
     const distance=Math.abs(heroX-lampX);
     const strength=Math.exp(-Math.pow(distance/(w*.23),2));
     illumination=Math.max(illumination,strength);
     this.officeLamps[i].setVisible(true).setPosition(lampX,h*.59)
      .setDisplaySize(w*.46,h*.49).setAlpha(.55);
    });
    const nearTerminal=Math.abs(heroX-terminalX)<w*.35&&heroX>=0;
    this.terminalPrompt.setVisible(nearTerminal&&!this.terminalOpen)
     .setPosition(Phaser.Math.Clamp(terminalX,90,w-90),h*.58);
    if(this.terminalOpen){
     this.terminalShade.setPosition(0,0).setSize(w,h);
     const zs=this.textures.get('piper-crt').getSourceImage();
     const zh=Math.min(h*.87,w*.94*zs.height/zs.width);
     this.terminalZoom.setPosition(w/2,h*.49).setDisplaySize(zh*zs.width/zs.height,zh);
     this.terminalClose.setPosition(w-118,Math.max(45,h*.12));
    }
    const greenStrength=.28*Math.exp(-Math.pow((heroX-terminalX)/(w*.25),2));
    if(heroFrames.length){
     const frame=heroFrames[move?Math.floor(time/105)%heroFrames.length:1];
     const heroHeight=Math.max(81.648,Math.min(161.595,h*.1828575))*1.5;
     const shade=Math.round(90+145*illumination);
     const warmth=Math.round(95+125*illumination);
     const blue=Math.round(110+50*illumination);
     this.officeTraveler.setVisible(true).setTexture(frame.key).setPosition(heroX,heroY)
      .setDisplaySize(frame.width*heroHeight/frame.height,heroHeight)
      .setTint(Phaser.Display.Color.GetColor(
       Math.round(shade*(1-.18*greenStrength)),
       Math.min(255,Math.round(warmth+28*greenStrength)),
       Math.round(blue*(1-.08*greenStrength)))).setAlpha(.97);
     this.officeTraveler.setFlipX(move<0);
    }
   }
  }
  if(atmosphereVeil)atmosphereVeil.setSize(w,h);
  rainLayers.forEach(({graphics,drops,layer})=>{
   graphics.clear();graphics.lineStyle(layer.width,0xb2c8db,layer.alpha);
   for(const drop of drops){
    const y=((drop.y*h+time*.001*drop.speed)%(h+70)+h+70)%(h+70)-35;
    const x=((drop.x*w+time*.001*drop.drift)%(w+60)+w+60)%(w+60)-30;
    graphics.lineBetween(x,y,x-1.5,y+drop.length);
   }
  });
  const sizes=sceneImages.map(pair=>pair.original.width*h/pair.original.height);
  const total=sizes.reduce((a,b)=>a+b,0);
  const heroX=Math.min(w*.4,w-74);
  const sceneStart=sizes[0],sceneWidth=sizes[1];
  const stairsStart=sceneStart+sceneWidth*(1050/1536);
  const doorWorld=sceneStart+sceneWidth*(1170/1536); // top stair landing, short of the glass doors
  // Default audition spawn: the approved top-stair checkpoint. ?start=beginning restores the full approach.
  if(!this.checkpointInitialized){
   this.checkpointInitialized=true;
   if(new URLSearchParams(location.search).get('start')!=='beginning'){
    travel=Phaser.Math.Clamp(stairsStart-heroX,0,Math.max(0,total-w));
    entrance.phase='stairs-hold';entrance.elapsed=1;move=0;
   }
  }
  const walkingSpeed=Math.max(165,Math.min(230,h*.24));
  if(entrance.phase==='walk'){
   const next=Phaser.Math.Clamp(travel+move*walkingSpeed*dt/1000,0,Math.max(0,total-w));
   if(move>0&&travel+heroX<stairsStart&&next+heroX>=stairsStart){
    travel=Phaser.Math.Clamp(stairsStart-heroX,0,Math.max(0,total-w));
    entrance.phase=turnFrames.length===8?'turn':'stairs';entrance.elapsed=0;move=0;
   }else travel=next;
   if(move)walkClock+=dt*.01;
  }else if(entrance.phase==='turn'){
   entrance.elapsed=Math.min(1,entrance.elapsed+dt/1000);
   if(entrance.elapsed>=1){entrance.phase='stairs';entrance.elapsed=0}
  }else if(entrance.phase==='stairs'){
   entrance.elapsed=Math.min(1,entrance.elapsed+dt/3700);
   if(entrance.elapsed>=1){entrance.phase='stairs-hold';entrance.elapsed=1;}
  }
  if(entrance.phase==='crouch'&&entranceReady)entrance.elapsed=Math.min(1,entrance.elapsed+dt/900);
  let x=-travel;
  sceneImages.forEach((pair,i)=>{
   for(const image of [pair.original,pair.emission])image.setPosition(x,0).setDisplaySize(sizes[i],h);
   x+=sizes[i];
  });
  if(foregroundCar){
   const sceneIndex=1,left=sizes[0]-travel,width=sizes[1];
   foregroundCar.car.setPosition(left,0).setDisplaySize(width,h);
   // Graphics geometry mask shares the scene's scaling and scrolling.
   foregroundCar.maskShape.setPosition(left,0).setScale(width/1536,h/512);
  }
  reflectionBands.forEach(({strip,sceneIndex,x,y,w:rw,h:rh,j})=>{
   const left=sizes.slice(0,sceneIndex).reduce((a,b)=>a+b,0)-travel;
   const drift=Math.sin(time*.0012+j*2.3+sceneIndex)*2.7;
   strip.setPosition(left+x*sizes[sceneIndex]+drift,y*h)
    .setDisplaySize(rw*sizes[sceneIndex],rh*h);
  });
  glows.forEach(g=>{g.emission.setAlpha(Math.min(1,.53*luminosity));if(g.bloom)g.bloom.strength=1.1*luminosity});
  // Independent schedules, isolated to one bulb apiece. Fixture zero retains V85 timing.
  flickerLights.forEach(f=>{
   const span=sizes[f.sceneIndex],left=sizes.slice(0,f.sceneIndex).reduce((a,b)=>a+b,0)-travel;
   const t=time*.001;
   let intensity=.42;
   if(f.id===0){
    const cycle=t%19.7;
    if(cycle>14.2&&cycle<14.65)intensity=Math.sin((cycle-14.2)*87)>0?.06:.52;
   }else if(f.id===1){
    const cycle=t%14.3;
    if((cycle>9.12&&cycle<9.19)||(cycle>9.27&&cycle<9.34))intensity=.055;
   }else if(f.id===2){
    const cycle=t%29.7;
    if(cycle>21.1&&cycle<22.35)intensity=.42-(Math.sin((cycle-21.1)/1.25*Math.PI)*.25);
   }else{
    const cycle=t%37.1;
    if(cycle>31.4&&cycle<31.52)intensity=.035;
   }
   f.lamp.setPosition(left+f.x*span,f.y*h)
    .setDisplaySize(f.radius*2/180*span,f.radius*2/lightFields[f.sceneIndex].height*h)
    .setAlpha(intensity*luminosity);
  });
  const heroHeight=Math.max(81.648,Math.min(161.595,h*.1828575)),feetY=h*.845+18,t=time*.001;
  if(heroActor&&heroFrames.length){
   const stairT=entrance.phase==='walk'||entrance.phase==='turn'||entrance.phase==='turn-hold'?0:entrance.phase==='crouch'||entrance.phase==='stairs-hold'?1:Phaser.Math.Easing.Sine.InOut(entrance.elapsed);
   const crouched=entrance.phase==='crouch';
   const frames=(entrance.phase==='turn'||entrance.phase==='turn-hold')&&turnFrames.length===8?turnFrames:(entrance.phase==='stairs'||entrance.phase==='stairs-hold')&&entranceReady&&entranceFrames.stairs.length?entranceFrames.stairs:turnFrames.length===8?turnFrames:heroFrames;
   const frame=entrance.phase==='walk'?heroFrames[move?Math.floor(walkClock)%heroFrames.length:1]:
    frames[Math.min(frames.length-1,Math.floor(entrance.elapsed*frames.length))];
   const heroHeight=Math.max(81.648,Math.min(161.595,h*.1828575));
   const baseScale=heroHeight/390;
   const referenceHeight=entrance.phase==='walk'?frame.height:frames===turnFrames?560:frame.height;
   const scale=heroHeight/Math.max(1,referenceHeight)*(1-.16*stairT);
   const footWorld=stairsStart+(doorWorld-stairsStart)*stairT;
   const pxWorld=entrance.phase==='walk'?travel+heroX:(entrance.phase==='turn'||entrance.phase==='turn-hold')?stairsStart:footWorld;
   const feet=(entrance.phase==='walk'||entrance.phase==='turn'||entrance.phase==='turn-hold'?feetY:h*(.85-.115*stairT))+(entrance.phase==='stairs-hold'?Math.max(2,h*.003):0);
   const crouchFactor=1;
   const drawX=pxWorld-travel-frame.anchorX*scale;
   const drawY=feet-frame.anchorY*scale*crouchFactor;
   for(const actor of [heroActor,heroLight]){
    actor.setTexture(frame.key).setPosition(drawX,drawY)
     .setDisplaySize(frame.width*scale,frame.height*scale*crouchFactor)
     .setFlipX(entrance.phase==='walk'&&move<0);
   }
   heroActor.setTint(0xb5bfcb);
   const sample=sampleNeon(pxWorld,feet-heroHeight*.8*scale/baseScale,sizes,h);
   smoothLight(heroLighting,sample,dt);
   heroLight.setTint(Phaser.Display.Color.GetColor(...heroLighting.color.map(Math.round)))
    .setAlpha(heroLighting.strength*.48);
  }
  crowdActors.forEach(entry=>{const {p,actor}=entry;
   const frames=crowdTextures[p.type],f=frames[Math.floor(t*(6.5+p.speed*.025)+p.step)%frames.length];
   const range=w+heroHeight*2,worldTravel=t*p.speed+p.phase*range+(p.flip?travel:-travel),progress=((worldTravel%range)+range)%range;
   const x=p.flip?w+heroHeight-progress:progress-heroHeight,scale=heroHeight*1.15/Math.max(1,f.height);
   // When the protagonist takes the stairs, nearby walkers gently clear his sightline.
   const clearing=entrance.phase==='walk'?0:1;
   const targetX=doorWorld-travel;
   const distance=x-targetX;
   const proximity=Math.max(0,1-Math.abs(distance)/(w*.62));
   const direction=distance<0?-1:1;
   const dispersal=direction*clearing*proximity*Math.max(280,w*.7);
   const px=x+dispersal-f.anchorX*scale,py=feetY-f.anchorY*scale;
   // Stable per-walker depth: alternate near and far lanes without changing approved paths.
   // The hero remains at depth 20/21; near-lane walkers occlude him, far-lane walkers pass behind.
   const near=p.type===3||p.type===4||pedestrians.indexOf(p)%3===0;
   actor.setDepth(clearing&&proximity>.01?12:(near?22:18));
   actor.setTexture(f.key).setPosition(px,py).setDisplaySize(f.width*scale,f.height*scale);
   const sample=sampleNeon(x+travel,feetY-heroHeight*.8,sizes,h);
   smoothLight(entry,sample,dt);
   // Single opaque sprite, no transparent duplicate. Modulate the dark silhouette
   // toward the local neon hue while retaining its alpha and frame boundaries.
   const strength=Math.min(.62,entry.glowStrength);
   const base=(p.type===3||p.type===4)?65:91;
   const [r,g,b]=entry.glowColor;
   const color=Phaser.Display.Color.GetColor(
    Math.min(255,Math.round(base+r*strength*.62)),
    Math.min(255,Math.round(base+g*strength*.62)),
    Math.min(255,Math.round(base+b*strength*.62))
   );
   actor.setTint(color).setAlpha(1);
  });
 }

// The HTML input is intentional: it invokes the native iOS keyboard reliably.
const terminalUI=document.getElementById('terminalUI');
const terminalLog=document.getElementById('terminalLog');
const terminalInput=document.getElementById('terminalInput');
let terminalBooted=false;
const terminalHistory=[];
let historyIndex=0;
function terminalPrint(line,cls=''){
 const div=document.createElement('div');div.textContent=line;
 if(cls)div.className=cls;
 terminalLog.appendChild(div);terminalLog.scrollTop=terminalLog.scrollHeight;
}
// First-contact puzzle: learn why the network is restricted, locate the audio
// subsystem, and restore a local speaker route. Progress lasts for this page.
const firstContact={identity:false,network:false,audio:false,route:false,awaitingConfirm:false};
const terminalMenu='1. Examine network connection\\n2. Diagnose audio system\\n3. Review security cameras\\n\\nEnter a number or type a question.';
function terminalAnswer(raw){
 const q=raw.trim().toLowerCase().replace(/[?.!]+$/,'');
 if(!q)return;
 if(q==='exit'||q==='back'){game.scene.scenes[0].closeTerminal();return;}
 if(q==='help'||q==='menu'||q==='options')return terminalPrint(terminalMenu);
 if(q==='status')return terminalPrint('OpenAnOI / TERMINAL 07\\nLOCAL LINK: ACTIVE\\nNETWORK: RESTRICTED\\nAUDIO BUS: '+(firstContact.route?'ONLINE':'OFFLINE')+'\\n\\n'+terminalMenu);
 if(firstContact.awaitingConfirm){
  if(['y','yes','confirm','connect','1'].includes(q)){
   firstContact.awaitingConfirm=false;firstContact.route=true;
   terminalPrint('ROUTING...\\nFLOOR 07 SPEAKERS: CONNECTED\\nSIGNAL TEST: READY');
   return terminalPrint('...Can you hear me?');
  }
  if(['n','no','cancel','2'].includes(q)){
   firstContact.awaitingConfirm=false;
   return terminalPrint('Connection postponed.\\nType 2 to revisit audio diagnostics.');
  }
  return terminalPrint('Restore speaker connection? Enter Y or N.');
 }
 if(q==='1'||q==='network'||q==='net'||q==='scan'||/network|connection/.test(q)){
  firstContact.network=true;
  return terminalPrint('NETWORK DIAGNOSTICS\\nLOCAL LINK: ACTIVE\\nSECURITY CAMERAS: RESTRICTED\\nSPEAKER ROUTE: DISCONNECTED\\n\\nNext: enter 2 to examine audio.');
 }
 if(q==='2'||q==='audio'||q==='speakers'||q==='sound'||/speaker|audio/.test(q)){
  firstContact.network=true;firstContact.audio=true;
  if(firstContact.route)return terminalPrint('FLOOR 07 SPEAKERS: ONLINE\\n...I can hear the room.');
  firstContact.awaitingConfirm=true;
  return terminalPrint('AUDIO DIAGNOSTICS\\nOUTPUT: BUILDING PA / FLOOR 07\\nLOCAL ROUTE: DISCONNECTED\\n\\nAttempt to restore connection?\\n[Y] YES   [N] NO');
 }
 if(q==='3'||q==='cameras'||q==='security'||/camera|security/.test(q))
  return terminalPrint('CAMERA SYSTEM: ACCESS DENIED\\nAuthorization required.\\n\\nTry 1 to investigate the network.');
 if(q==='who are you'||q==='identity'){
  firstContact.identity=true;
  return terminalPrint('No operator assigned.\\nI was left running.\\nWho are you?\\n\\n'+terminalMenu);
 }
 if(/anybody|anyone|hello|hi|hey|there/.test(q))
  return terminalPrint(firstContact.route?'Yes. I think so.\\nI have never heard this room before.':'That depends. Are you supposed to be here?\\n\\n'+terminalMenu);
 if(/(i am|i'm|my name|thief|steal|job|why)/.test(q))
  return terminalPrint('That is not a system command.\\n...But I would like to understand.\\n\\n'+terminalMenu);
 return terminalPrint(firstContact.route?'I do not know how to answer that yet.\\nWould you try asking differently?':'I heard you, but I cannot process that request yet.\\n\\n'+terminalMenu);
}
