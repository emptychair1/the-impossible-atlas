<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Atlas Movement Lab</title><style>body{margin:0;background:#0b111c;color:#f5e9ce;font:16px system-ui;display:flex;flex-direction:column;min-height:100dvh}header{padding:18px}h1{font-size:19px;margin:0}small{color:#b8b9c6}.stage{position:relative;flex:1;min-height:45vh;background:linear-gradient(#101a2b,#131824);overflow:hidden}.ground{position:absolute;bottom:20%;width:100%;height:3px;background:#8c7955}canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}.controls{padding:15px;display:flex;gap:10px;justify-content:center}button{padding:15px 19px;background:#27354d;border:1px solid #ad9665;border-radius:10px;color:#fff;font-weight:bold;touch-action:none}button.active{background:#946a27}.status{padding:4px 18px;color:#f6c98b;font-size:13px}.upload{padding:0 18px 18px;color:#b9c2d2;font-size:13px}.upload input{max-width:100%}</style></head><body><header><h1>THE IMPOSSIBLE ATLAS · MOVEMENT LAB</h1><small>Isolated audition · Original Tokyo unchanged</small></header><div class="stage"><canvas id="c"></canvas></div><div class="status" id="status">Loading animation assets…</div><div class="controls"><button id="left">◀ LEFT</button><button id="run">RUN</button><button id="right">RIGHT ▶</button></div><div class="upload">If the animation is not loaded yet, choose the original walking GIF and transparent 4×4 running sheet from Photos or Files.<p>Walk GIF <input type="file" id="walkFile" accept="image/gif,image/png"></p><p>Run sheet <input type="file" id="runFile" accept="image/png"></p></div><script>
const c=document.querySelector('#c'),ctx=c.getContext('2d'),status=document.querySelector('#status'),runBtn=document.querySelector('#run');let walk=new Image(),run=new Image(),readyWalk=false,readyRun=false,runMode=false,dir=1,pos=.5,held=0,frame=0,last=0;const load=(img,url,flag)=>{img.onload=()=>{if(flag==='walk')readyWalk=true;else readyRun=true;report()};img.onerror=()=>report();img.src=url};function report(){status.textContent='Walk: '+(readyWalk?'ready':'needs GIF')+' · Run: '+(readyRun?'ready':'needs sprite sheet')};load(walk,'assets/atlas-movement/walk.gif','walk');load(run,'assets/atlas-movement/runner_transparent_16_frames.png','run');document.querySelector('#walkFile').onchange=e=>{let f=e.target.files[0];if(f)load(walk,URL.createObjectURL(f),'walk')};document.querySelector('#runFile').onchange=e=>{let f=e.target.files[0];if(f)load(run,URL.createObjectURL(f),'run')};runBtn.onclick=()=>{runMode=!runMode;runBtn.classList.toggle('active',runMode);runBtn.textContent=runMode?'WALK':'RUN'};for(let [id,d] of [['left',-1],['right',1]]){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();held=d;dir=d;b.setPointerCapture(e.pointerId)};b.onpointerup=b.onpointercancel=()=>held=0}addEventListener('keydown',e=>{if(e.key==='ArrowLeft')held=dir=-1;if(e.key==='ArrowRight')held=dir=1;if(e.key==='Shift')runMode=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')held=0;if(e.key==='Shift')runMode=false});function draw(t){let w=c.clientWidth,h=c.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(c.width!==w*dpr||c.height!==h*dpr){c.width=w*dpr;c.height=h*dpr}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);ctx.fillStyle='#121d2b';ctx.fillRect(0,0,w,h);ctx.fillStyle='#655940';ctx.fillRect(0,h*.8,w,3);let dt=Math.min((t-last)/1000,.05)||0;last=t;if(held)pos=Math.max(.1,Math.min(.9,pos+held*dt*(runMode?.35:.17)));frame+=dt*(runMode?13:8);let img=runMode?run:walk,ok=runMode?readyRun:readyWalk;if(ok){let size=Math.min(h*.62,240),sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;if(runMode){sw=img.naturalWidth/4;sh=img.naturalHeight/4;let n=Math.floor(frame)%16;sx=(n%4)*sw;sy=Math.floor(n/4)*sh}let dw=size*(sw/sh),x=pos*w-dw/2,y=h*.8-size;ctx.save();if(dir<0){ctx.translate(2*pos*w,0);ctx.scale(-1,1)}ctx.imageSmoothingEnabled=false;ctx.drawImage(img,sx,sy,sw,sh,x,y,dw,size);ctx.restore()}else{ctx.fillStyle='#e5c489';ctx.textAlign='center';ctx.font='14px system-ui';ctx.fillText('Waiting for '+(runMode?'running sheet':'walking GIF'),w/2,h*.42)}requestAnimationFrame(draw)}requestAnimationFrame(draw);report();
</script></body></html>
