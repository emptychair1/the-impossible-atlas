name: Install Averie in game
on:
  push:
    branches: [main]
    paths:
      - 'tools/add_averie.py'
      - '.github/workflows/install-averie.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Patch playable game
        run: python3 tools/add_averie.py
      - name: Commit game update
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Prototype 03: Averie joins Josh"
            git push
          fi
