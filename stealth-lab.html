<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta charset="utf-8"><title>Open AnI Stealth Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#070b13;color:#f4e9d6;font:14px system-ui;overflow:hidden}#hud{display:flex;justify-content:space-between;padding:9px 12px;align-items:center;background:#111927}#game{image-rendering:pixelated;width:100vw;height:calc(100dvh - 166px);display:block;touch-action:none}#controls{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px}button{border:1px solid #64728a;background:#202c41;color:white;border-radius:10px;min-height:55px;font-weight:700;font-size:12px;touch-action:none}button:active,.on{background:#506078}#msg{padding:5px 12px;min-height:27px;color:#e9c9a0}#help{font-size:11px;color:#a5b4c8;padding:0 12px 5px}</style></head><body><div id="hud"><strong>OPEN AnI · STEALTH LAB V2 · PIXEL</strong><span id="hp">🚬 100% · 📦📦📦</span><span id="alert">UNDETECTED</span></div><canvas id="game"></canvas><div id="msg">Reach the green exit. Hide behind the crate. Disarm the mine.</div><div id="controls"><button data-key="left">◀ MOVE</button><button data-key="right">MOVE ▶</button><button data-key="crouch">CROUCH</button><button data-key="hide">HIDE</button><button data-key="interact">DISARM</button></div><div id="help">Hold move / crouch. Tap HIDE near crate. Hold DISARM near mine. Tap canvas to restart after winning.</div><script>
const c=document.getElementById('game'),g=c.getContext('2d'),keys={},W=900,H=430;let player,guard,mine,cam,t=0,last=0,ended=false,alarm=0,pack=3,hp=100,hidden=false,disarm=0,checkpoint=70;
function reset(){player={x:70,y:335};guard={x:490,dir:1,susp:0};mine={x:645,armed:true};cam={x:770,y:65};t=0;alarm=0;hp=100;pack=3;hidden=false;disarm=0;ended=false;checkpoint=70;msg('Reach the green exit. Avoid the guard and camera.');}function msg(s){document.getElementById('msg').textContent=s}reset();
for(const b of document.querySelectorAll('button')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true;b.classList.add('on');if(k==='hide'){hidden=!hidden;msg(hidden?'Trying to hide…':'Leaving cover…')}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{keys[k]=false;b.classList.remove('on')})}
document.addEventListener('keydown',e=>{const k={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'crouch',e:'interact',h:'hide'}[e.key];if(k){keys[k]=true;if(k==='hide'&&!e.repeat)hidden=!hidden}});document.addEventListener('keyup',e=>{const k={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'crouch',e:'interact',h:'hide'}[e.key];if(k)keys[k]=false});c.onclick=()=>{if(ended)reset()};
function resize(){const d=Math.min(devicePixelRatio||1,2),rect=c.getBoundingClientRect();c.width=rect.width*d;c.height=rect.height*d;g.setTransform(c.width/W,0,0,c.height/H,0,0);g.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function line(x,y,X,Y,col,width=2){g.strokeStyle=col;g.lineWidth=width;g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke()}
function pixel(x,y,w,h,color){g.fillStyle=color;g.fillRect(Math.round(x/5)*5,Math.round(y/5)*5,Math.max(5,Math.round(w/5)*5),Math.max(5,Math.round(h/5)*5))}
function actor(x,guardType=false){const y=350,bob=Math.sin(t*7)*2,coat=guardType?'#d6d1bf':'#d2a42d';pixel(x-10,y-15,8,15,'#172436');pixel(x+3,y-15,8,15,'#172436');pixel(x-13,y-49+bob,26,34,coat);pixel(x-16,y-42,5,22,guardType?'#233c53':'#896b24');pixel(x+12,y-42,5,22,guardType?'#233c53':'#896b24');pixel(x-10,y-65+bob,20,16,guardType?'#d2b69a':'#bd9326');pixel(x-13,y-69+bob,26,6,guardType?'#20354d':'#8d6e1d');pixel(x-7,y-57+bob,14,6,'#17222d');if(guardType){pixel(x-10,y-42,20,17,'#20354c');pixel(x-6,y-38,12,5,'#8ca3b4')}else{pixel(x+14,y-40,12,5,'#c4ae85');pixel(x+26,y-41,5,5,'#ff7631')}}
function draw(){g.fillStyle='#090e19';g.fillRect(0,0,W,H);
for(let x=0;x<W;x+=120){pixel(x,0,110,350,'#101d2d');pixel(x+5,0,10,350,'#23364a');pixel(x+95,0,10,350,'#1d3042');pixel(x+25,110,60,90,'#1c3042');pixel(x+30,120,50,5,'#5a8590');pixel(x+30,180,50,5,'#3b5b6b')}
for(let x=65;x<W;x+=260){pixel(x,35,100,12,'#263e4e');pixel(x+10,39,80,5,'#87bec1');pixel(x+38,48,24,5,'#4b8292');pixel(x+30,220,40,90,'#1b3043');pixel(x+35,230,30,50,'#385869')}
pixel(0,350,W,80,'#192637');pixel(0,350,W,10,'#405a68');for(let x=0;x<W;x+=70){pixel(x,390,55,5,'#2b4150');pixel(x+20,415,40,5,'#26394a')}
pixel(25,315,75,35,'#185749');pixel(35,325,55,5,'#7eb7a0');pixel(850,270,40,80,'#174f42');pixel(860,285,20,50,'#77c9a5');
pixel(200,255,100,95,'#263647');pixel(210,265,80,75,'#394f61');pixel(220,275,15,10,'#8299a6');pixel(270,275,10,10,'#8299a6');pixel(210,330,80,10,'#1a293a');
pixel(375,310,35,40,'#35465a');pixel(380,315,25,10,'#f0b95c');
const beamY=185+Math.sin(t*.95)*85;pixel(545,beamY-20,15,40,'#384b60');g.save();g.shadowColor='#ff3654';g.shadowBlur=20;line(560,beamY,635,beamY,'#ff4c64',5);g.restore();
if(mine.armed){pixel(mine.x-20,340,40,10,'#5d293c');pixel(mine.x-15,340,30,5,'#ff5675')}else{pixel(mine.x-20,340,40,10,'#285c4c');pixel(mine.x-15,340,30,5,'#7bf1bd')}
const scan=cam.x+Math.sin(t*.8)*130;g.fillStyle='rgba(255,239,198,.19)';g.beginPath();g.moveTo(cam.x,cam.y+12);g.lineTo(scan-90,350);g.lineTo(scan+90,350);g.closePath();g.fill();pixel(cam.x-20,cam.y-10,40,20,'#536a7d');pixel(cam.x-8,cam.y+10,16,10,'#d7c8a5');
actor(guard.x,true);actor(player.x,false);
if(hidden&&Math.abs(player.x-250)<51)pixel(player.x-15,295,30,55,'#182737');
if(disarm>0){pixel(mine.x-30,300,60,10,'#263749');pixel(mine.x-30,300,60*Math.min(1,disarm/2),10,'#72eab5')}
g.fillStyle='#c7d9d7';g.font='bold 13px monospace';g.fillText('OPEN AnI // RESTRICTED SECTOR 07',20,28);g.fillStyle='#e9a4a4';g.fillText('SECURITY ACTIVE',730,28)}
function update(dt){if(ended)return;t+=dt;const speed=keys.crouch?70:140;if(keys.left)player.x-=speed*dt;if(keys.right)player.x+=speed*dt;player.x=Math.max(15,Math.min(880,player.x));if(player.x>390)checkpoint=390;
const cover=Math.abs(player.x-250)<51;const actuallyHidden=hidden&&cover;if(hidden&&!cover)hidden=false;
guard.x+=guard.dir*55*dt;if(guard.x>530){guard.x=530;guard.dir=-1}if(guard.x<425){guard.x=425;guard.dir=1}
const dist=Math.abs(player.x-guard.x),inSight=(player.x-guard.x)*guard.dir>0&&dist<170&&!actuallyHidden;const coneCenter=cam.x+Math.sin(t*.8)*130;const inCamera=Math.abs(player.x-coneCenter)<82&&!actuallyHidden&&player.x>670;const mineHit=mine.armed&&Math.abs(player.x-mine.x)<20;const beamY=185+Math.sin(t*.95)*85;const beamHit=player.x>548&&player.x<635&&beamY>295&&(keys.crouch?beamY>323:beamY>299);
const detection=inSight||inCamera||mineHit||beamHit;alarm=Math.max(0,Math.min(100,alarm+(detection?90:-30)*dt));if(detection&&alarm>60){hp-=23*dt;document.getElementById('alert').textContent='⚠ DETECTED'}else document.getElementById('alert').textContent=alarm>20?'SUSPICIOUS':'UNDETECTED';
if(keys.interact&&Math.abs(player.x-mine.x)<60&&keys.crouch&&mine.armed){disarm+=dt;if(disarm>=2){mine.armed=false;disarm=0;msg('Mine disarmed! Keep moving.')}}else disarm=Math.max(0,disarm-dt*2);
if(hp<=0){pack--;hp=100;alarm=0;player.x=checkpoint;hidden=false;msg(pack?'Cigarette burned out. Respawned at checkpoint.':'All cigarette packs gone. Tap stage to retry.');if(pack<=0)ended=true}
if(player.x>860){ended=true;msg('MISSION COMPLETE! 🚬 You made it through Open AnI. Tap stage to replay.')}
document.getElementById('hp').textContent='🚬 '+Math.ceil(hp)+'% · '+ '📦'.repeat(Math.max(0,pack))}
function frame(now){const dt=Math.min(.04,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
