<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta charset="utf-8"><title>Open AnI Stealth Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#070b13;color:#f4e9d6;font:14px system-ui;overflow:hidden}#hud{display:flex;justify-content:space-between;padding:9px 12px;align-items:center;background:#111927}#game{width:100vw;height:calc(100dvh - 166px);display:block;touch-action:none}#controls{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:8px}button{border:1px solid #64728a;background:#202c41;color:white;border-radius:10px;min-height:55px;font-weight:700;font-size:12px;touch-action:none}button:active,.on{background:#506078}#msg{padding:5px 12px;min-height:27px;color:#e9c9a0}#help{font-size:11px;color:#a5b4c8;padding:0 12px 5px}</style></head><body><div id="hud"><strong>OPEN AnI · STEALTH LAB V1</strong><span id="hp">🚬 100% · 📦📦📦</span><span id="alert">UNDETECTED</span></div><canvas id="game"></canvas><div id="msg">Reach the green exit. Hide behind the crate. Disarm the mine.</div><div id="controls"><button data-key="left">◀ MOVE</button><button data-key="right">MOVE ▶</button><button data-key="crouch">CROUCH</button><button data-key="hide">HIDE</button><button data-key="interact">DISARM</button></div><div id="help">Hold move / crouch. Tap HIDE near crate. Hold DISARM near mine. Tap canvas to restart after winning.</div><script>
const c=document.getElementById('game'),g=c.getContext('2d'),keys={},W=900,H=430;let player,guard,mine,cam,t=0,last=0,ended=false,alarm=0,pack=3,hp=100,hidden=false,disarm=0,checkpoint=70;
function reset(){player={x:70,y:335};guard={x:490,dir:1,susp:0};mine={x:645,armed:true};cam={x:770,y:65};t=0;alarm=0;hp=100;pack=3;hidden=false;disarm=0;ended=false;checkpoint=70;msg('Reach the green exit. Avoid the guard and camera.');}function msg(s){document.getElementById('msg').textContent=s}reset();
for(const b of document.querySelectorAll('button')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true;b.classList.add('on');if(k==='hide'){hidden=!hidden;msg(hidden?'Trying to hide…':'Leaving cover…')}});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{keys[k]=false;b.classList.remove('on')})}
document.addEventListener('keydown',e=>{const k={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'crouch',e:'interact',h:'hide'}[e.key];if(k){keys[k]=true;if(k==='hide'&&!e.repeat)hidden=!hidden}});document.addEventListener('keyup',e=>{const k={ArrowLeft:'left',ArrowRight:'right',ArrowDown:'crouch',e:'interact',h:'hide'}[e.key];if(k)keys[k]=false});c.onclick=()=>{if(ended)reset()};
function resize(){const d=Math.min(devicePixelRatio||1,2),rect=c.getBoundingClientRect();c.width=rect.width*d;c.height=rect.height*d;g.setTransform(c.width/W,0,0,c.height/H,0,0)}addEventListener('resize',resize);resize();
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}function line(x,y,X,Y,col,width=2){g.strokeStyle=col;g.lineWidth=width;g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke()}
function draw(){g.fillStyle='#090e19';g.fillRect(0,0,W,H);for(let x=0;x<W;x+=90){rect(x,0,2,H,'#1b293b');rect(x+8,20,48,9,'#182739')}rect(0,350,W,80,'#182231');line(0,350,W,350,'#4b5a6e',3);rect(28,320,70,30,'#1b614b');g.fillStyle='#c1ffe1';g.font='12px system-ui';g.fillText('START',43,339);rect(855,285,36,65,'#165f4e');g.fillStyle='#b5fbd9';g.fillText('EXIT',855,275);
rect(205,260,92,90,'#344354');rect(211,268,80,72,'#253141');rect(222,274,12,12,'#73869b');g.fillStyle='#9eafc2';g.fillText('COVER',226,253);
rect(377,317,28,33,'#394b5f');rect(377,312,28,5,'#eeae57');g.fillStyle='#a7d3f4';g.fillText('CHECKPOINT',344,303);
const beamY=185+Math.sin(t*.95)*85;rect(548,beamY-17,14,34,'#344356');rect(553,beamY-6,5,12,'#ff4566');g.save();g.shadowBlur=17;g.shadowColor='#ff244e';line(560,beamY,635,beamY,'#ff425e',4);g.restore();
if(mine.armed){g.save();g.shadowColor='#ff3457';g.shadowBlur=16;rect(mine.x-17,342,34,8,'#e84b63');g.restore();g.fillStyle='#f9a6b1';g.fillText('MINE',mine.x-18,333)}else{rect(mine.x-17,342,34,8,'#389c7a');g.fillStyle='#a0f5d0';g.fillText('SAFE',mine.x-17,333)}
const scan=cam.x+Math.sin(t*.8)*130;g.fillStyle='rgba(255,242,204,.17)';g.beginPath();g.moveTo(cam.x,cam.y+12);g.lineTo(scan-90,350);g.lineTo(scan+90,350);g.closePath();g.fill();rect(cam.x-19,cam.y-9,38,20,'#425064');rect(cam.x-6,cam.y+10,12,8,'#c3bca9');
const gx=guard.x;rect(gx-11,304,22,37,'#22364c');rect(gx-10,310,20,11,'#e3d4bd');rect(gx-11,292,22,15,'#d2bfa1');rect(gx-13,289,26,5,'#24384f');rect(gx-9,341,8,9,'#101824');rect(gx+3,341,8,9,'#101824');g.fillStyle='#d6e5f3';g.font='11px system-ui';g.fillText('OPEN AnI',gx-26,282);g.fillStyle='rgba(255,244,195,.10)';g.beginPath();g.moveTo(gx,310);g.lineTo(gx+guard.dir*170,270);g.lineTo(gx+guard.dir*170,350);g.fill();
const crouch=keys.crouch;const py=crouch?322:296;g.globalAlpha=hidden&&Math.abs(player.x-250)<57?.33:1;rect(player.x-12,py+8,24,350-(py+8),'#d1a32c');rect(player.x-10,py-9,20,20,'#c59c28');rect(player.x-7,py-4,14,8,'#1c2630');rect(player.x+8,py+5,12,3,'#d2c2a0');g.fillStyle='#ff7d2b';g.fillRect(player.x+20,py+5,3,2);g.globalAlpha=1;g.fillStyle='#f0e4c8';g.fillText('🚬',player.x+19,py+1);
if(disarm>0){rect(mine.x-30,300,60,7,'#293447');rect(mine.x-30,300,60*Math.min(1,disarm/2),7,'#72efae')}
g.fillStyle='#e9e0c9';g.font='14px system-ui';g.fillText('STEALTH TRAINING · HOLD INTERACT TO DISARM',18,24);
}
function update(dt){if(ended)return;t+=dt;const speed=keys.crouch?70:140;if(keys.left)player.x-=speed*dt;if(keys.right)player.x+=speed*dt;player.x=Math.max(15,Math.min(880,player.x));if(player.x>390)checkpoint=390;
const cover=Math.abs(player.x-250)<51;const actuallyHidden=hidden&&cover;if(hidden&&!cover)hidden=false;
guard.x+=guard.dir*55*dt;if(guard.x>530){guard.x=530;guard.dir=-1}if(guard.x<425){guard.x=425;guard.dir=1}
const dist=Math.abs(player.x-guard.x),inSight=(player.x-guard.x)*guard.dir>0&&dist<170&&!actuallyHidden;const coneCenter=cam.x+Math.sin(t*.8)*130;const inCamera=Math.abs(player.x-coneCenter)<82&&!actuallyHidden&&player.x>670;const mineHit=mine.armed&&Math.abs(player.x-mine.x)<20;const beamY=185+Math.sin(t*.95)*85;const beamHit=player.x>548&&player.x<635&&beamY>295&&(keys.crouch?beamY>323:beamY>299);
const detection=inSight||inCamera||mineHit||beamHit;alarm=Math.max(0,Math.min(100,alarm+(detection?90:-30)*dt));if(detection&&alarm>60){hp-=23*dt;document.getElementById('alert').textContent='⚠ DETECTED'}else document.getElementById('alert').textContent=alarm>20?'SUSPICIOUS':'UNDETECTED';
if(keys.interact&&Math.abs(player.x-mine.x)<60&&keys.crouch&&mine.armed){disarm+=dt;if(disarm>=2){mine.armed=false;disarm=0;msg('Mine disarmed! Keep moving.')}}else disarm=Math.max(0,disarm-dt*2);
if(hp<=0){pack--;hp=100;alarm=0;player.x=checkpoint;hidden=false;msg(pack?'Cigarette burned out. Respawned at checkpoint.':'All cigarette packs gone. Tap stage to retry.');if(pack<=0)ended=true}
if(player.x>860){ended=true;msg('MISSION COMPLETE! 🚬 You made it through Open AnI. Tap stage to replay.')}
document.getElementById('hp').textContent='🚬 '+Math.ceil(hp)+'% · '+ '📦'.repeat(Math.max(0,pack))}
function frame(now){const dt=Math.min(.04,(now-last)/1000||.016);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
