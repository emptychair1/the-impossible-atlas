<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Parkour Lab V9 · Slide</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#071018;color:#d6ffe7;font:14px system-ui;overflow:hidden}header{padding:14px 16px}h2{margin:0;font-size:18px}p{margin:5px 0;color:#9fc3b3}canvas{display:block;width:100%;height:55vh;touch-action:none;image-rendering:pixelated;background:#0b1520}.buttons{display:flex;gap:12px;padding:14px;justify-content:flex-end;padding-right:18px}button{background:#133329;border:1px solid #6ed6a4;color:#d7ffe8;width:78px;height:78px;border-radius:50%;font-size:13px;font-weight:800;touch-action:none}button:active,button.active{background:#32684d}#status{padding:4px 16px;color:#a5dfc5;text-align:center}</style></head><body><header><h2>PARKOUR LAB · V9 SLIDE</h2><p>Isolated test. Auto-run. Tap JUMP for running jump; tap SLIDE for forward slide. Same game-style touch layout. Frozen chase untouched.</p></header><canvas id="stage"></canvas><div class="buttons"><button id="jump">▲ JUMP</button><button id="slide">SLIDE</button></div><div id="status">Loading original character ZIP…</div><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),status=document.getElementById('status');let run=[],crouch=[],jump=[],slide=[],held='',clock=0,last=0,ready=false,jumpTime=-1,slideTime=-1;const JUMP_MS=760,SLIDE_MS=620;
const VISUAL_SCALE={run:1,jump:1.22,slide:1.18};
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=canvas.clientWidth*d;canvas.height=canvas.clientHeight*d;ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
for(const id of ['jump','slide']){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('active');
  if(id==='jump'){if(jumpTime<0&&slideTime<0){jumpTime=0;clock=0}}
  else if(slideTime<0&&jumpTime<0){slideTime=0;clock=0}
 });
 for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>b.classList.remove('active'));
}
window.addEventListener('blur',()=>{for(const id of ['jump','slide'])document.getElementById(id).classList.remove('active')});
async function load(){
 if(typeof JSZip==='undefined'){status.textContent='ZIP library unavailable. Check network connection.';return}
 const archives=['Detailed_cinematic_pixel-Idle_copy.zip','Detailed_cinematic_pixel-Idle_copy_2.zip','Detailed_cinematic_pixel-Idle.zip'];
 const errors=[];
 const jumpPaths=Array.from({length:8},(_,i)=>'https://raw.githubusercontent.com/emptychair1/the-impossible-atlas/main/assets/parkour/running-jump/frame_'+String(i).padStart(3,'0')+'.png');
 const jumpLoaded=await Promise.allSettled(jumpPaths.map(async url=>{const im=new Image();im.src=url;await im.decode();return im}));
 jump=jumpLoaded.filter(r=>r.status==='fulfilled').map(r=>r.value);
 const slidePaths=Array.from({length:6},(_,i)=>'https://raw.githubusercontent.com/emptychair1/the-impossible-atlas/main/assets/parkour/slide/frame_'+String(i).padStart(3,'0')+'.png');
 const slideLoaded=await Promise.allSettled(slidePaths.map(async url=>{const im=new Image();im.src=url;await im.decode();return im}));
 slide=slideLoaded.filter(r=>r.status==='fulfilled').map(r=>r.value);
 async function decode(zip,path){
  const bytes=await zip.file(path).async('base64');
  const im=new Image();im.src='data:image/png;base64,'+bytes;await im.decode();return im;
 }
 for(const name of archives){
  try{
   const response=await fetch('https://raw.githubusercontent.com/emptychair1/the-impossible-atlas/main/assets/'+name);
   if(!response.ok){errors.push(name+': HTTP '+response.status);continue}
   const zip=await JSZip.loadAsync(await response.arrayBuffer());
   const paths=Object.keys(zip.files).filter(p=>!zip.files[p].dir&&/\.png$/i.test(p));
   const preferred=paths.filter(p=>/\/animations\/Running\/east\/frame_\d+\.png$/i.test(p))
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
   const runs=preferred.length?preferred:paths.filter(p=>/\/Running\/east\//i.test(p))
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
   const crouches=paths.filter(p=>/crouch|duck/i.test(p)&&/east|right/i.test(p))
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
   if(runs.length&&!run.length){
    run=await Promise.all(runs.slice(0,16).map(p=>decode(zip,p)));
   }
   if(crouches.length&&!crouch.length){
    const dir=crouches[0].slice(0,crouches[0].lastIndexOf('/')+1);
    crouch=await Promise.all(crouches.filter(p=>p.startsWith(dir)).slice(0,16).map(p=>decode(zip,p)));
   }
   if(run.length&&crouch.length)break;
   errors.push(name+': '+paths.length+' PNGs, '+runs.length+' running, '+crouches.length+' crouch');
  }catch(e){errors.push(name+': '+e.message);console.warn(name,e)}
 }
 ready=Boolean(run.length||jump.length||slide.length);
 status.textContent=ready
  ?'V9 · '+run.length+' RUN frames · '+jump.length+' RUNNING JUMP frames · '+slide.length+' SLIDE frames'+(!crouch.length?' (crouch asset not found; running preview works)':'')
  :'No character frames found: '+errors.join(' | ');
 if(!ready)console.error('Parkour asset diagnostics:',errors);
}

function frame(t){
 const dt=Math.min((t-last)||16,60);last=t;clock+=dt;
 if(jumpTime>=0){jumpTime+=dt;if(jumpTime>=JUMP_MS){jumpTime=-1;clock=0}}
 if(slideTime>=0){slideTime+=dt;if(slideTime>=SLIDE_MS){slideTime=-1;clock=0}}
 const airborne=jumpTime>=0,sliding=slideTime>=0;
 const w=canvas.width,h=canvas.height,floor=h*.76;
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#101f2b';
 for(let x=0;x<w;x+=w/12)ctx.fillRect(x,0,2,h);
 ctx.fillStyle='#1e3a35';ctx.fillRect(0,floor,w,5);
 ctx.fillStyle='#7effb4';ctx.font=Math.max(13,w*.018)+'px monospace';
 ctx.fillText(airborne?'RUNNING JUMP':sliding?'SLIDE':'RUN',18,35);
 if(ready){
  const seq=airborne&&jump.length?jump:sliding&&slide.length?slide:run.length?run:jump.length?jump:slide;
  const index=airborne&&seq===jump?Math.min(Math.floor(jumpTime/JUMP_MS*seq.length),seq.length-1):sliding&&seq===slide?Math.min(Math.floor(slideTime/SLIDE_MS*seq.length),seq.length-1):Math.floor(clock/90)%seq.length;
  const img=seq[index];
  const baseHeight=Math.min(h*.38,200*(devicePixelRatio||1));
  const kind=airborne&&seq===jump?'jump':sliding&&seq===slide?'slide':'run';
  const height=baseHeight*VISUAL_SCALE[kind],scale=height/img.height;
  const lift=airborne?Math.sin(Math.PI*jumpTime/JUMP_MS)*h*.23:0;
  ctx.drawImage(img,w*.5-img.width*scale*.5,floor-height-lift,img.width*scale,height);
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);load();
</script></body></html>
