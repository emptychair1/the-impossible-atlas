<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Parkour Lab V2 · Asset Recovery</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#071018;color:#d6ffe7;font:14px system-ui;overflow:hidden}header{padding:14px 16px}h2{margin:0;font-size:18px}p{margin:5px 0;color:#9fc3b3}canvas{display:block;width:100%;height:55vh;touch-action:none;image-rendering:pixelated;background:#0b1520}.buttons{display:flex;gap:10px;padding:14px;justify-content:center}button{background:#133329;border:1px solid #6ed6a4;color:#d7ffe8;padding:16px 22px;border-radius:12px;font-weight:800;touch-action:none}button:active,button.active{background:#32684d}#status{padding:4px 16px;color:#a5dfc5;text-align:center}</style></head><body><header><h2>PARKOUR LAB · V2 ASSET RECOVERY</h2><p>Isolated test. Hold RUN or CROUCH; release to stand. No chase changes.</p></header><canvas id="stage"></canvas><div class="buttons"><button id="run">HOLD RUN ▶</button><button id="crouch">HOLD CROUCH ▼</button></div><div id="status">Loading original character ZIP…</div><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),status=document.getElementById('status');let run=[],crouch=[],held='',clock=0,last=0,ready=false;
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=canvas.clientWidth*d;canvas.height=canvas.clientHeight*d;ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
for(const id of ['run','crouch']){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held=id;b.classList.add('active')});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{if(held===id)held='';b.classList.remove('active')})}
async function load(){
 if(typeof JSZip==='undefined'){status.textContent='ZIP library unavailable. Check network connection.';return}
 const archives=['Detailed_cinematic_pixel-Idle_copy.zip','Detailed_cinematic_pixel-Idle_copy_2.zip','Detailed_cinematic_pixel-Idle.zip'];
 const errors=[];
 async function decode(zip,path){
  const bytes=await zip.file(path).async('base64');
  const im=new Image();im.src='data:image/png;base64,'+bytes;await im.decode();return im;
 }
 for(const name of archives){
  try{
   const response=await fetch('assets/'+name);
   if(!response.ok){errors.push(name+': HTTP '+response.status);continue}
   const zip=await JSZip.loadAsync(await response.arrayBuffer());
   const paths=Object.keys(zip.files).filter(p=>!zip.files[p].dir&&/\\.png$/i.test(p));
   const preferred=paths.filter(p=>/\/animations\/Running\/east\/frame_\\d+\\.png$/i.test(p))
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
   const runs=preferred.length?preferred:paths.filter(p=>/\/Running\/east\//i.test(p))
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
   const crouches=paths.filter(p=>/crouch|duck/i.test(p)&&/east|right/i.test(p))
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
   if(runs.length&&!run.length){
    run=await Promise.all(runs.slice(0,16).map(p=>decode(zip,p)));
   }
   if(crouches.length&&!crouch.length){
    const dir=crouches[0].slice(0,crouches[0].lastIndexOf('/')+1);
    crouch=await Promise.all(crouches.filter(p=>p.startsWith(dir)).slice(0,16).map(p=>decode(zip,p)));
   }
   if(run.length&&crouch.length)break;
   errors.push(name+': '+paths.length+' PNGs, '+runs.length+' running, '+crouches.length+' crouch');
  }catch(e){errors.push(name+': '+e.message);console.warn(name,e)}
 }
 ready=Boolean(run.length||crouch.length);
 status.textContent=ready
  ?'V2 · '+run.length+' RUN frames · '+crouch.length+' CROUCH frames'+(!crouch.length?' (crouch asset not found; running preview works)':'')
  :'No character frames found: '+errors.join(' | ');
 if(!ready)console.error('Parkour asset diagnostics:',errors);
}

function frame(t){const dt=Math.min((t-last)||16,60);last=t;clock+=dt;const w=canvas.width,h=canvas.height,floor=h*.76;ctx.clearRect(0,0,w,h);ctx.fillStyle='#101f2b';for(let x=0;x<w;x+=w/12){ctx.fillRect(x,0,2,h)}ctx.fillStyle='#1e3a35';ctx.fillRect(0,floor,w,5);ctx.fillStyle='#7effb4';ctx.font=Math.max(13,w*.018)+'px monospace';ctx.fillText(held==='crouch'?'CROUCH':held==='run'?'RUN':'IDLE',18,35);if(ready){const seq=held==='crouch'&&crouch.length?crouch:run.length?run:crouch;const index=held?Math.floor(clock/(held==='crouch'?110:90))%seq.length:0;const img=seq[index];const height=Math.min(h*.38,200*devicePixelRatio),scale=height/img.height;ctx.drawImage(img,w*.5-img.width*scale*.5,floor-height,img.width*scale,height)}requestAnimationFrame(frame)}requestAnimationFrame(frame);load();
</script></body></html>
