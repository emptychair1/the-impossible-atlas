<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Parkour Lab V12 · Horizontal Wall Run</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#071018;color:#d6ffe7;font:14px system-ui;overflow:hidden}header{padding:14px 16px}h2{margin:0;font-size:18px}p{margin:5px 0;color:#9fc3b3}canvas{display:block;width:100%;height:55vh;touch-action:none;image-rendering:pixelated;background:#0b1520}.buttons{display:flex;gap:12px;padding:14px;justify-content:flex-end;padding-right:18px}button{background:#133329;border:1px solid #6ed6a4;color:#d7ffe8;width:78px;height:78px;border-radius:50%;font-size:13px;font-weight:800;touch-action:none}button:active,button.active{background:#32684d}#status{padding:4px 16px;color:#a5dfc5;text-align:center}</style></head><body><header><h2>PARKOUR LAB · V12 HORIZONTAL WALL RUN</h2><p>Isolated test. Auto-run. WALL RUN now plants onto a long wall parallel to the chase, holds a fixed wall-running height while traveling horizontally, then pushes off, lands, and returns to RUN. Frozen chase untouched.</p></header><canvas id="stage"></canvas><div class="buttons"><button id="jump">▲ JUMP</button><button id="slide">SLIDE</button><button id="wallrun">WALL RUN</button></div><div id="status">Loading original character ZIP…</div><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d'),status=document.getElementById('status');let run=[],crouch=[],jump=[],slide=[],wallrun=[],held='',clock=0,last=0,ready=false,jumpTime=-1,slideTime=-1,wallTime=-1;const JUMP_MS=760,SLIDE_MS=620,WALL_MS=1150;
const VISUAL_SCALE={run:1,jump:1.22,slide:1.18};
const SLIDE_DROP=.17,SLIDE_IN=.24,SLIDE_OUT=.28;
const WALL_APPROACH=.20,WALL_PLANT=.12,WALL_EXIT=.24,WALL_HEIGHT=.16;
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=canvas.clientWidth*d;canvas.height=canvas.clientHeight*d;ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
for(const id of ['jump','slide','wallrun']){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{
  e.preventDefault();b.setPointerCapture(e.pointerId);b.classList.add('active');
  if(id==='jump'){if(jumpTime<0&&slideTime<0&&wallTime<0){jumpTime=0;clock=0}}
  else if(id==='slide'){if(slideTime<0&&jumpTime<0&&wallTime<0){slideTime=0;clock=0}}
  else if(wallTime<0&&jumpTime<0&&slideTime<0){wallTime=0;clock=0}
 });
 for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>b.classList.remove('active'));
}
window.addEventListener('blur',()=>{for(const id of ['jump','slide','wallrun'])document.getElementById(id).classList.remove('active')});
async function load(){
 if(typeof JSZip==='undefined'){status.textContent='ZIP library unavailable. Check network connection.';return}
 const archives=['Detailed_cinematic_pixel-Idle_copy.zip','Detailed_cinematic_pixel-Idle_copy_2.zip','Detailed_cinematic_pixel-Idle.zip'];
 const errors=[];
 const jumpPaths=Array.from({length:8},(_,i)=>'https://raw.githubusercontent.com/emptychair1/the-impossible-atlas/main/assets/parkour/running-jump/frame_'+String(i).padStart(3,'0')+'.png');
 const jumpLoaded=await Promise.allSettled(jumpPaths.map(async url=>{const im=new Image();im.src=url;await im.decode();return im}));
 jump=jumpLoaded.filter(r=>r.status==='fulfilled').map(r=>r.value);
 const slidePaths=Array.from({length:6},(_,i)=>'https://raw.githubusercontent.com/emptychair1/the-impossible-atlas/main/assets/parkour/slide/frame_'+String(i).padStart(3,'0')+'.png');
 const slideLoaded=await Promise.allSettled(slidePaths.map(async url=>{const im=new Image();im.src=url;await im.decode();return im}));
 slide=slideLoaded.filter(r=>r.status==='fulfilled').map(r=>r.value);
 const wallPaths=Array.from({length:9},(_,i)=>'https://raw.githubusercontent.com/emptychair1/the-impossible-atlas/main/assets/parkour/wall-run/frame_'+String(i).padStart(3,'0')+'.png');
 const wallLoaded=await Promise.allSettled(wallPaths.map(async url=>{const im=new Image();im.src=url;await im.decode();return im}));
 wallrun=wallLoaded.filter(r=>r.status==='fulfilled').map(r=>r.value);
 async function decode(zip,path){
  const bytes=await zip.file(path).async('base64');
  const im=new Image();im.src='data:image/png;base64,'+bytes;await im.decode();return im;
 }
 for(const name of archives){
  try{
   const response=await fetch('https://raw.githubusercontent.com/emptychair1/the-impossible-atlas/main/assets/'+name);
   if(!response.ok){errors.push(name+': HTTP '+response.status);continue}
   const zip=await JSZip.loadAsync(await response.arrayBuffer());
   const paths=Object.keys(zip.files).filter(p=>!zip.files[p].dir&&/\.png$/i.test(p));
   const preferred=paths.filter(p=>/\/animations\/Running\/east\/frame_\d+\.png$/i.test(p))
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
   const runs=preferred.length?preferred:paths.filter(p=>/\/Running\/east\//i.test(p))
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
   const crouches=paths.filter(p=>/crouch|duck/i.test(p)&&/east|right/i.test(p))
    .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
   if(runs.length&&!run.length){
    run=await Promise.all(runs.slice(0,16).map(p=>decode(zip,p)));
   }
   if(crouches.length&&!crouch.length){
    const dir=crouches[0].slice(0,crouches[0].lastIndexOf('/')+1);
    crouch=await Promise.all(crouches.filter(p=>p.startsWith(dir)).slice(0,16).map(p=>decode(zip,p)));
   }
   if(run.length&&crouch.length)break;
   errors.push(name+': '+paths.length+' PNGs, '+runs.length+' running, '+crouches.length+' crouch');
  }catch(e){errors.push(name+': '+e.message);console.warn(name,e)}
 }
 ready=Boolean(run.length||jump.length||slide.length||wallrun.length);
 status.textContent=ready
  ?'V12 · '+run.length+' RUN · '+jump.length+' JUMP · '+slide.length+' SLIDE · '+wallrun.length+' HORIZONTAL WALL RUN · PLANT/HOLD/KICK/LAND'+(!crouch.length?' (crouch asset not found; running preview works)':'')
  :'No character frames found: '+errors.join(' | ');
 if(!ready)console.error('Parkour asset diagnostics:',errors);
}

function frame(t){
 const dt=Math.min((t-last)||16,60);last=t;clock+=dt;
 if(jumpTime>=0){jumpTime+=dt;if(jumpTime>=JUMP_MS){jumpTime=-1;clock=0}}
 if(slideTime>=0){slideTime+=dt;if(slideTime>=SLIDE_MS){slideTime=-1;clock=0}}
 if(wallTime>=0){wallTime+=dt;if(wallTime>=WALL_MS){wallTime=-1;clock=0}}
 const airborne=jumpTime>=0,sliding=slideTime>=0,walling=wallTime>=0;
 const w=canvas.width,h=canvas.height,floor=h*.76;
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#101f2b';
 for(let x=0;x<w;x+=w/12)ctx.fillRect(x,0,2,h);
 ctx.fillStyle='#1e3a35';ctx.fillRect(0,floor,w,5);
 // Long wall parallel to the chase: its seams scroll left to make horizontal travel readable.
 if(walling){
  const wallTop=h*.20,wallBottom=floor+h*.03;
  ctx.fillStyle='#18303a';ctx.fillRect(0,wallTop,w,wallBottom-wallTop);
  ctx.fillStyle='#31505a';ctx.fillRect(0,wallTop,w,4);
  const scroll=(wallTime*.55)%(w*.16);
  ctx.fillStyle='#24434c';
  for(let x=-scroll;x<w;x+=w*.16)ctx.fillRect(x,wallTop,3,wallBottom-wallTop);
  for(let y=wallTop+h*.12;y<wallBottom;y+=h*.12)ctx.fillRect(0,y,w,2);
 }
 ctx.fillStyle='#7effb4';ctx.font=Math.max(13,w*.018)+'px monospace';
 ctx.fillText(airborne?'RUNNING JUMP':sliding?'SLIDE':walling?'WALL RUN':'RUN',18,35);
 if(ready){
  const seq=airborne&&jump.length?jump:sliding&&slide.length?slide:walling&&wallrun.length?wallrun:run.length?run:jump.length?jump:slide.length?slide:wallrun;
  let slideP=sliding?Math.min(1,slideTime/SLIDE_MS):0;
  let wallP=walling?Math.min(1,wallTime/WALL_MS):0;
  let index;
  if(airborne&&seq===jump) index=Math.min(Math.floor(jumpTime/JUMP_MS*seq.length),seq.length-1);
  else if(sliding&&seq===slide){
   // Existing six frames already describe the body compressing into and recovering from the slide.
   // Ease through them rather than snapping straight to a low sprite.
   const eased=slideP<.5?2*slideP*slideP:1-Math.pow(-2*slideP+2,2)/2;
   index=Math.min(Math.floor(eased*seq.length),seq.length-1);
  } else if(walling&&seq===wallrun){
   const eased=wallP<.5?2*wallP*wallP:1-Math.pow(-2*wallP+2,2)/2;
   index=Math.min(Math.floor(eased*seq.length),seq.length-1);
  } else index=Math.floor(clock/90)%seq.length;
  const img=seq[index];
  const baseHeight=Math.min(h*.38,200*(devicePixelRatio||1));
  const kind=airborne&&seq===jump?'jump':sliding&&seq===slide?'slide':'run';
  const height=baseHeight*VISUAL_SCALE[kind],scale=height/img.height;
  const lift=airborne?Math.sin(Math.PI*jumpTime/JUMP_MS)*h*.23:0;
  // Drop the actor's visual center during entry, keep it low through the slide,
  // then recover to the exact running baseline before RUN resumes.
  let drop=0;
  if(sliding){
   if(slideP<SLIDE_IN) drop=(slideP/SLIDE_IN)*h*SLIDE_DROP;
   else if(slideP>1-SLIDE_OUT) drop=((1-slideP)/SLIDE_OUT)*h*SLIDE_DROP;
   else drop=h*SLIDE_DROP;
  }
  let actorX=w*.5,wallLift=0;
  if(walling){
   // Horizontal wall run: small plant rise, fixed-height travel, then a clean drop to RUN.
   // The wall texture moves beneath him to sell forward travel while contact stays locked.
   if(wallP<WALL_APPROACH){
    const q=wallP/WALL_APPROACH;
    const eased=q*q*(3-2*q);
    wallLift=eased*h*WALL_HEIGHT;
    actorX=w*.5+eased*w*.035;
   }else if(wallP<1-WALL_EXIT){
    wallLift=h*WALL_HEIGHT;
    actorX=w*.535;
   }else{
    const q=(wallP-(1-WALL_EXIT))/WALL_EXIT;
    const eased=q*q*(3-2*q);
    wallLift=(1-eased)*h*WALL_HEIGHT;
    actorX=w*.535-eased*w*.035;
   }
  }
  ctx.drawImage(img,actorX-img.width*scale*.5,floor-height+drop-lift-wallLift,img.width*scale,height);
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);load();
</script></body></html>
