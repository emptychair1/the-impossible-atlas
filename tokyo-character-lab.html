<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tokyo Character Calibration Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#09101c;color:#f4f0e5;font:14px system-ui}header{padding:13px 15px}h1{font-size:21px;margin:0}small{color:#9eafc4}main{max-width:860px;margin:auto}.stage{position:relative;margin:0 12px;border:1px solid #53627b;border-radius:13px;overflow:hidden;background:#121c2b}canvas{display:block;width:100%;height:auto}.panel{padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;color:#c6d5e6}label strong{float:right;color:#ffe19a}input[type=range]{width:100%;accent-color:#edc14b}button{border:1px solid #8291a7;border-radius:10px;background:#293c56;color:#fff;padding:12px 16px;font:inherit;font-weight:700}.actions{padding:0 14px 14px;display:flex;gap:8px;flex-wrap:wrap}pre{margin:0 14px 18px;padding:12px;white-space:pre-wrap;word-break:break-word;background:#111a29;border-radius:10px;color:#b7d9ff;font-size:12px}.wide{grid-column:1/-1}.status{padding:0 14px 10px;color:#a9c7dc}</style></head><body><main><header><h1>🌧️ Tokyo Character Calibration Lab</h1><small>V1 · Real Tokyo pedestrian vs. yellow mannequin · Tokyo untouched</small></header><div class="stage"><canvas id="view" width="800" height="450"></canvas></div><div id="status" class="status">Loading original Tokyo assets…</div><div class="panel" id="controls"></div><div class="actions"><button id="copy">📋 Copy exported CSS</button><button id="reset">Reset sliders</button><button id="freeze">Pause animation</button></div><pre id="export"></pre></main><script>
const cfg=[['scale','Character scale',100,25,300,1,'%'],['x','Horizontal offset',0,-300,300,1,'px'],['y','Vertical offset',0,-160,160,1,'px'],['tint','Yellow tint',100,0,100,1,'%'],['light','Neon lighting',35,0,100,1,'%'],['pedScale','Pedestrian scale',100,30,200,1,'%']];
const state=Object.fromEntries(cfg.map(a=>[a[0],a[2]])),ctl=document.getElementById('controls'),canvas=document.getElementById('view'),ctx=canvas.getContext('2d'),status=document.getElementById('status');let running=true,frame=0,last=0;
for(const [key,name,val,min,max,step,unit] of cfg){const label=document.createElement('label');label.innerHTML='<span>'+name+'</span><strong id="v-'+key+'">'+val+unit+'</strong><input type="range" id="s-'+key+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'">';ctl.append(label);label.querySelector('input').addEventListener('input',e=>{state[key]=+e.target.value;label.querySelector('strong').textContent=e.target.value+unit;renderExport();draw()})}
const base='/';const load=src=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=()=>reject(Error(src));im.src=src});
let hero=null,ped=null,bg=null,pedFrames=[];
function getPedFrames(image){const w=image.width,h=image.height,c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(image,0,0);const pixels=cx.getImageData(0,0,w,h).data,seen=new Uint8Array(w*h),queue=new Int32Array(w*h),comps=[];for(let start=0;start<w*h;start++){if(seen[start]||pixels[start*4+3]<32)continue;let head=0,tail=0,minX=w,minY=h,maxX=0,maxY=0,area=0;seen[start]=1;queue[tail++]=start;while(head<tail){const p=queue[head++],x=p%w,y=(p/w)|0;area++;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=w||ny>=h)continue;const k=ny*w+nx;if(!seen[k]&&pixels[k*4+3]>32){seen[k]=1;queue[tail++]=k}}}if(area>Math.max(200,w*h*.0005))comps.push({x:minX,y:minY,w:maxX-minX+1,h:maxY-minY+1,area})}return comps.sort((a,b)=>a.y-b.y||a.x-b.x).slice(0,8)}
async function init(){try{[hero,ped,bg]=await Promise.all([load('/prototype-character/assets/p1_Walking.png'),load('/assets/umbrella-commuter.png'),load('/assets/tokyo-scenes/FFC4A81F-57E3-4153-8242-4DBB5DF6AAF4.png')]);pedFrames=getPedFrames(ped);status.textContent='Assets loaded · Compare both figures against the same pavement line.';draw()}catch(e){status.textContent='Asset loading problem: '+e.message}}
function draw(){ctx.clearRect(0,0,800,450);ctx.fillStyle='#111d2b';ctx.fillRect(0,0,800,450);if(bg){const scale=450/bg.height,sw=bg.width*scale;ctx.drawImage(bg,0,0,sw,450)}ctx.fillStyle='rgba(6,13,23,.17)';ctx.fillRect(0,0,800,450);
const ground=390;ctx.setLineDash([7,6]);ctx.strokeStyle='rgba(255,210,110,.7)';ctx.beginPath();ctx.moveTo(0,ground);ctx.lineTo(800,ground);ctx.stroke();ctx.setLineDash([]);
if(ped&&pedFrames.length){const f=pedFrames[frame%pedFrames.length],h=138*state.pedScale/100,w=f.w/f.h*h;ctx.drawImage(ped,f.x,f.y,f.w,f.h,500-w/2,ground-h,w,h)}
if(hero){const i=frame%12,s=state.scale/100,h=128*s,w=128*s,x=260+state.x,y=ground+state.y;ctx.save();ctx.drawImage(hero,i*128,0,128,128,x-w/2,y-h*.94,w,h);ctx.globalCompositeOperation='source-atop';ctx.fillStyle='rgba(255,213,43,'+(state.tint/100*.62)+')';ctx.fillRect(x-w/2,y-h*.94,w,h);ctx.restore();if(state.light){ctx.save();ctx.globalCompositeOperation='screen';const g=ctx.createRadialGradient(x-30,y-h*.7,0,x-30,y-h*.7,h*.9);g.addColorStop(0,'rgba(63,153,255,'+(state.light/100*.34)+')');g.addColorStop(1,'rgba(63,153,255,0)');ctx.fillStyle=g;ctx.fillRect(x-h,y-h*1.8,h*2,h*2);ctx.restore()}}
ctx.fillStyle='#ffe7a3';ctx.font='bold 14px system-ui';ctx.fillText('OUR MANNEQUIN',175,35);ctx.fillText('TOKYO PEDESTRIAN',425,35)}
function css(){return `/* Tokyo Character Calibration Lab · paste into chat */\n:root {\n  --mannequin-scale: ${state.scale / 100};\n  --mannequin-offset-x: ${state.x}px;\n  --mannequin-offset-y: ${state.y}px;\n  --mannequin-yellow-tint: ${state.tint}%;\n  --mannequin-neon-light: ${state.light}%;\n  --reference-pedestrian-scale: ${state.pedScale / 100};\n}\n/* Apply scale to sprite size; offsets to its ground-anchored position. */`}
function renderExport(){document.getElementById('export').textContent=css()}
document.getElementById('copy').onclick=async()=>{const value=css();try{await navigator.clipboard.writeText(value);document.getElementById('copy').textContent='✓ Copied CSS'}catch(e){const area=document.createElement('textarea');area.value=value;document.body.append(area);area.select();document.execCommand('copy');area.remove();document.getElementById('copy').textContent='✓ Copied CSS'}};
document.getElementById('reset').onclick=()=>{for(const [k,,v,,,,unit] of cfg){state[k]=v;document.getElementById('s-'+k).value=v;document.getElementById('v-'+k).textContent=v+unit}renderExport();draw()};
document.getElementById('freeze').onclick=()=>{running=!running;document.getElementById('freeze').textContent=running?'Pause animation':'Resume animation'};
function tick(t){if(running&&t-last>110){frame++;last=t;draw()}requestAnimationFrame(tick)}renderExport();init();requestAnimationFrame(tick);
</script></body></html>
