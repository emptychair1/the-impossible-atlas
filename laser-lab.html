<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Laser Lab · Impossible Atlas</title><style>
*{box-sizing:border-box}body{margin:0;background:#070a10;color:#e9eff6;font:13px system-ui}header{padding:12px 16px;background:#111824;display:flex;justify-content:space-between;align-items:center}h1{font-size:16px;margin:0}small{color:#a4b6ca}#stage{width:100%;height:57vh;min-height:290px;display:block;touch-action:none;background:#05090f}#panel{padding:14px;max-width:920px;margin:auto}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:block;color:#b9c9da}input[type=range]{width:100%;accent-color:#ff3455}button{background:#1c293b;color:white;border:1px solid #45556a;padding:10px 12px;border-radius:7px}button:active{background:#35475e}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}#readout{font-family:monospace;color:#b9eac9;white-space:pre-wrap;margin-top:12px}#help{color:#a4b6ca;margin:8px 0 14px}#status{color:#e8b99e} @media(max-width:450px){#stage{height:49vh}.grid{gap:8px}}</style></head><body><header><div><h1>🔴 LASER LAB <small>V1 · isolated prototype</small></h1><small>THE IMPOSSIBLE ATLAS</small></div><span id="status">Loading assets…</span></header><canvas id="stage"></canvas><div id="panel"><p id="help">Drag the red laser to move it. Drag either circular handle to change its angle and length. Drag the yellow traveler to test clearance. Sliders offer fine control.</p><div class="grid"><label>Angle <output id="angleV"></output><input id="angle" type="range" min="-70" max="70" value="25"></label><label>Beam length <output id="lengthV"></output><input id="length" type="range" min="18" max="95" value="64"></label><label>Beam height <output id="heightV"></output><input id="height" type="range" min="8" max="88" value="48"></label><label>Laser thickness <output id="thicknessV"></output><input id="thickness" type="range" min="3" max="25" value="11"></label><label>Emitter size <output id="emitterV"></output><input id="emitter" type="range" min="30" max="170" value="100"></label><label>Traveler position <output id="travelerV"></output><input id="traveler" type="range" min="4" max="96" value="30"></label></div><div class="actions"><button id="flip">↗ Flip diagonal</button><button id="duck">▼ Toggle crouch</button><button id="reset">↺ Reset</button><button id="copy">Copy settings</button></div><div id="readout"></div></div><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
const A='assets/',cv=document.getElementById('stage'),ctx=cv.getContext('2d'),status=document.getElementById('status');
const keys=['angle','length','height','thickness','emitter','traveler'];const defaults={angle:25,length:64,height:48,thickness:11,emitter:100,traveler:30};
const vals={...defaults};let cx=.52,duck=false,drag=null,background=null,laser=null,hero=null,laserAspect=3,heroAspect=.5;
const loadImg=src=>new Promise((resolve,reject)=>{let i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src});
async function init(){
 try{laser=await loadImg(A+'1DCF9FB2-8B0C-4FC1-AF80-4903F6B2310F.png')}catch(e){status.textContent='Laser asset unavailable';}
 try{let candidates=await Promise.all(['8EF0DC8E-FBF3-4105-A55F-A59882BAFC81.png','A5034D6D-327A-4433-A918-922D6BCBD0F2.png'].map(n=>loadImg(A+n)));background=candidates.sort((a,b)=>redScore(a)-redScore(b))[0]}catch(e){console.warn(e)}
 try{let r=await fetch(A+'Detailed_cinematic_pixel-Idle_copy.zip');let z=await JSZip.loadAsync(await r.arrayBuffer());let path=Object.keys(z.files).find(p=>/animations\/Idle\/east\/frame_000\.png$/i.test(p))||Object.keys(z.files).find(p=>/animations\/Walking\/east\/frame_000\.png$/i.test(p));if(path){let b=await z.file(path).async('base64');hero=await loadImg('data:image/png;base64,'+b)}}catch(e){console.warn('Hero frame unavailable',e)}
 status.textContent='Lab ready';render();
}
function redScore(img){let c=document.createElement('canvas');c.width=64;c.height=32;let q=c.getContext('2d');q.drawImage(img,0,0,64,32);let d=q.getImageData(0,0,64,32).data,n=0;for(let i=0;i<d.length;i+=4)if(d[i]>d[i+1]*1.5&&d[i]>d[i+2]*1.35&&d[i]>100)n++;return n}
function geom(w,h){let len=w*vals.length/100,ang=vals.angle*Math.PI/180,x=w*cx,y=h*vals.height/100;return{x,y,x1:x-Math.cos(ang)*len/2,y1:y+Math.sin(ang)*len/2,x2:x+Math.cos(ang)*len/2,y2:y-Math.sin(ang)*len/2,len,ang}}
function draw(){
 const rect=cv.getBoundingClientRect(),w=rect.width,h=rect.height,dpr=Math.min(devicePixelRatio||1,2);if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
 if(background){const scale=Math.max(w/background.width,h/background.height);let bw=background.width*scale,bh=background.height*scale;ctx.drawImage(background,(w-bw)/2,(h-bh)/2,bw,bh)}else{ctx.fillStyle='#111d2b';ctx.fillRect(0,0,w,h)}
 const g=geom(w,h),ex=Math.max(16,w*.038*vals.emitter/100),ey=Math.max(20,h*.085*vals.emitter/100);
 // The actual laser asset is a single image. Its black matte is screened out via additive blending.
 if(laser){ctx.save();ctx.translate(g.x,g.y);ctx.rotate(-g.ang);ctx.globalCompositeOperation='screen';ctx.drawImage(laser,-g.len/2-ex,-ey/2,g.len+2*ex,ey);ctx.restore()}
 ctx.save();ctx.globalCompositeOperation='screen';ctx.shadowColor='#ff1b35';ctx.shadowBlur=22;ctx.strokeStyle='rgba(255,20,42,.5)';ctx.lineWidth=vals.thickness*2.6;ctx.beginPath();ctx.moveTo(g.x1,g.y1);ctx.lineTo(g.x2,g.y2);ctx.stroke();ctx.shadowBlur=9;ctx.strokeStyle='#ff344b';ctx.lineWidth=vals.thickness*.8;ctx.stroke();ctx.shadowBlur=0;ctx.strokeStyle='#fff2e8';ctx.lineWidth=Math.max(1,vals.thickness*.17);ctx.stroke();ctx.restore();
 for(const [x,y] of [[g.x1,g.y1],[g.x2,g.y2]]){ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fillStyle='rgba(255,40,65,.18)';ctx.fill();ctx.strokeStyle='#ffb6c1';ctx.lineWidth=2;ctx.stroke()}
 const tx=w*vals.traveler/100,ty=h*.83,hh=h*(duck?.15:.26),hw=hh*.52;
 if(hero){ctx.drawImage(hero,tx-hw/2,ty-hh,hw,hh)}else{ctx.fillStyle='#d4a323';ctx.fillRect(tx-hw/2,ty-hh,hw,hh)}
 if(duck){ctx.strokeStyle='#a7ffb5';ctx.strokeRect(tx-hw/2,ty-hh,hw,hh)}
 ctx.font='12px monospace';ctx.fillStyle='#fff';ctx.fillText(duck?'CROUCH PREVIEW':'STANDING PREVIEW',12,h-12);
}
function render(){keys.forEach(k=>{document.getElementById(k).value=vals[k];document.getElementById(k+'V').textContent=vals[k]+(k==='angle'?'°':'')});let g=geom(cv.clientWidth,cv.clientHeight);document.getElementById('readout').textContent=JSON.stringify({angle:vals.angle,lengthPercent:vals.length,heightPercent:vals.height,thickness:vals.thickness,emitterScale:vals.emitter,centerXPercent:Math.round(cx*100),travelerPercent:vals.traveler,crouchPreview:duck},null,2);draw()}
keys.forEach(k=>document.getElementById(k).addEventListener('input',e=>{vals[k]=+e.target.value;render()}));
document.getElementById('flip').onclick=()=>{vals.angle=-vals.angle;render()};
document.getElementById('duck').onclick=()=>{duck=!duck;render()};
document.getElementById('reset').onclick=()=>{Object.assign(vals,defaults);cx=.52;duck=false;render()};
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(document.getElementById('readout').textContent).then(()=>{status.textContent='Settings copied!'}).catch(()=>{status.textContent='Select settings below to copy'});
function pointer(e){let r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
cv.addEventListener('pointerdown',e=>{let p=pointer(e),g=geom(cv.clientWidth,cv.clientHeight);let dist=(x,y)=>Math.hypot(p.x-x,p.y-y);drag=dist(g.x1,g.y1)<35?'left':dist(g.x2,g.y2)<35?'right':dist(cv.clientWidth*vals.traveler/100,cv.clientHeight*.78)<50?'traveler':'beam';cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;let p=pointer(e),w=cv.clientWidth,h=cv.clientHeight;if(drag==='traveler'){vals.traveler=Math.max(4,Math.min(96,Math.round(p.x/w*100)))}else if(drag==='beam'){cx=Math.max(.05,Math.min(.95,p.x/w));vals.height=Math.max(8,Math.min(88,Math.round(p.y/h*100)))}else{let g=geom(w,h),dx=p.x-g.x,dy=p.y-g.y;vals.angle=Math.max(-70,Math.min(70,Math.round(Math.atan2(-dy,dx)*(drag==='left'?-1:1)*180/Math.PI)));vals.length=Math.max(18,Math.min(95,Math.round(2*Math.hypot(dx,dy)/w*100)))}render()});
cv.addEventListener('pointerup',()=>drag=null);cv.addEventListener('pointercancel',()=>drag=null);window.addEventListener('resize',draw);render();init();
</script></body></html>
