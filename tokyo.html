<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>The Impossible Atlas · Tokyo</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;background:#02050b;color:#fff;font-family:system-ui}canvas{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.hint{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;text-align:center;font-size:12px;letter-spacing:.16em;color:#f4e3b3;text-shadow:0 2px 8px #000;pointer-events:none;opacity:.8}.version{position:fixed;right:9px;bottom:calc(env(safe-area-inset-bottom) + 7px);font:10px system-ui;color:rgba(255,255,255,.48);pointer-events:none;z-index:2}.badge{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:14px;font-size:10px;letter-spacing:.15em;color:#fff9;text-shadow:0 2px 6px #000;pointer-events:none}</style></head><body><canvas id="game"></canvas><div class="badge">THE IMPOSSIBLE ATLAS · TOKYO</div><div class="hint">HOLD RIGHT OR LEFT TO WALK · ← →</div><div class="version">V25</div><script>
const ROOT='assets/tokyo-scenes/';const SCENE_PATHS=[ROOT+'FFC4A81F-57E3-4153-8242-4DBB5DF6AAF4.png',ROOT+'745F0F74-D425-4FFD-8E82-FD3DA2F35910.png'];const SPRITE_PATH=ROOT+'9E8C5BA0-F636-4EF0-9E4F-FDF7908A3827.png';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d',{alpha:false});function load(src){const im=new Image();im.src=src;return im}const scenes=SCENE_PATHS.map(load),sprite=load(SPRITE_PATH);let width=0,height=0,dpr=1,camera=0,walkClock=0,lastTime=0,frames=[],pointerDirection=0;const keyboard=new Set();const CROWD_PATHS=["assets/umbrella-commuter.png","assets/phone-walker.png","assets/briefcase-commuter.png","assets/umbrella-couple.png","assets/umbrella-woman.png"];const crowdSprites=CROWD_PATHS.map(load),crowdFrames=crowdSprites.map(()=>[]);
function resize(){const v=window.visualViewport;width=Math.round(v?v.width:innerWidth);height=Math.round(v?v.height:innerHeight);dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high'}addEventListener('resize',resize);if(window.visualViewport)visualViewport.addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','a','d','A','D'].includes(e.key)){e.preventDefault();keyboard.add(e.key)}});addEventListener('keyup',e=>keyboard.delete(e.key));canvas.addEventListener('contextmenu',e=>e.preventDefault());canvas.addEventListener('selectstart',e=>e.preventDefault());canvas.addEventListener('dragstart',e=>e.preventDefault());canvas.addEventListener('pointerdown',e=>{pointerDirection=e.clientX<width/2?-1:1;try{canvas.setPointerCapture(e.pointerId)}catch{}});canvas.addEventListener('pointerup',()=>pointerDirection=0);canvas.addEventListener('pointercancel',()=>pointerDirection=0);
function extractSpriteFrames(image){
const source=document.createElement('canvas');source.width=image.naturalWidth;source.height=image.naturalHeight;const sc=source.getContext('2d',{willReadFrequently:true});sc.drawImage(image,0,0);const pixels=sc.getImageData(0,0,source.width,source.height).data;const w=source.width,h=source.height,count=w*h,labels=new Uint16Array(count),queue=new Uint32Array(count),components=[];const threshold=32;let label=0;
for(let start=0;start<count;start++){if(labels[start]||pixels[start*4+3]<=threshold)continue;label++;let head=0,tail=0,area=0,minX=w,minY=h,maxX=0,maxY=0;labels[start]=label;queue[tail++]=start;
while(head<tail){const i=queue[head++],x=i%w,y=(i/w)|0;area++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);for(let dy=-1;dy<=1;dy++){const ny=y+dy;if(ny<0||ny>=h)continue;for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx;if(nx<0||nx>=w)continue;const ni=ny*w+nx;if(!labels[ni]&&pixels[ni*4+3]>threshold){labels[ni]=label;queue[tail++]=ni}}}}if(area>10000)components.push({label,minX,minY,maxX,maxY})}
components.sort((a,b)=>(a.minY<h/2?0:1)-(b.minY<h/2?0:1)||a.minX-b.minX);if(components.length!==16){console.error('Expected 16 figures, found',components.length);return []}
const order=new Uint16Array(label+1);components.forEach((c,i)=>order[c.label]=i+1);for(let i=0;i<count;i++)labels[i]=order[labels[i]]||0;
const additions=new Uint16Array(count);for(let pass=0;pass<6;pass++){additions.fill(0);for(let i=0;i<count;i++){if(labels[i]||!pixels[i*4+3])continue;const x=i%w,y=(i/w)|0;let owner=0,conflict=false;for(let dy=-1;dy<=1&&!conflict;dy++){const ny=y+dy;if(ny<0||ny>=h)continue;for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx;if(nx<0||nx>=w)continue;const near=labels[ny*w+nx];if(!near)continue;if(owner&&owner!==near){conflict=true;break}owner=near}}if(owner&&!conflict)additions[i]=owner}for(let i=0;i<count;i++)if(additions[i])labels[i]=additions[i]}
const bounds=Array.from({length:16},()=>({minX:w,minY:h,maxX:0,maxY:0}));for(let i=0;i<count;i++){const owner=labels[i];if(!owner)continue;const x=i%w,y=(i/w)|0,b=bounds[owner-1];b.minX=Math.min(b.minX,x);b.maxX=Math.max(b.maxX,x);b.minY=Math.min(b.minY,y);b.maxY=Math.max(b.maxY,y)}
return bounds.map((b,frameIndex)=>{const fw=b.maxX-b.minX+1,fh=b.maxY-b.minY+1,fc=document.createElement('canvas');fc.width=fw;fc.height=fh;const fx=fc.getContext('2d'),fd=fx.createImageData(fw,fh);let weight=0,hoodX=0;for(let y=b.minY;y<=b.maxY;y++)for(let x=b.minX;x<=b.maxX;x++){const si=y*w+x;if(labels[si]!==frameIndex+1)continue;const so=si*4,to=((y-b.minY)*fw+x-b.minX)*4;for(let k=0;k<4;k++)fd.data[to+k]=pixels[so+k];if(y<=b.minY+fh*.28&&pixels[so+3]>threshold){hoodX+=(x-b.minX)*pixels[so+3];weight+=pixels[so+3]}}fx.putImageData(fd,0,0);return{image:fc,width:fw,height:fh,anchorX:weight?hoodX/weight:fw/2,anchorY:fh}})}
sprite.addEventListener('load',()=>{frames=extractSpriteFrames(sprite)},{once:true});if(sprite.complete&&sprite.naturalWidth)frames=extractSpriteFrames(sprite);

function extractPedestrianFrames(image){
 // Identical connected-alpha component isolation as the hero, generalized to eight frames.
 const w=image.naturalWidth,h=image.naturalHeight,source=document.createElement('canvas');source.width=w;source.height=h;
 const sc=source.getContext('2d',{willReadFrequently:true});sc.drawImage(image,0,0);
 const pixels=sc.getImageData(0,0,w,h).data,count=w*h,labels=new Uint16Array(count),queue=new Uint32Array(count),components=[];
 let label=0;const threshold=32;
 for(let start=0;start<count;start++){
  if(labels[start]||pixels[start*4+3]<=threshold)continue;
  label++;let head=0,tail=0,area=0,minX=w,minY=h,maxX=0,maxY=0;labels[start]=label;queue[tail++]=start;
  while(head<tail){const i=queue[head++],x=i%w,y=(i/w)|0;area++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);
   for(let dy=-1;dy<=1;dy++){const ny=y+dy;if(ny<0||ny>=h)continue;for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx;if(nx<0||nx>=w)continue;const ni=ny*w+nx;if(!labels[ni]&&pixels[ni*4+3]>threshold){labels[ni]=label;queue[tail++]=ni}}}
  }
  if(area>Math.max(200,w*h*.0005))components.push({label,minX,minY,maxX,maxY,area});
 }
 components.sort((a,b)=>a.minY-b.minY||a.minX-b.minX);
 if(components.length!==8){console.warn('Pedestrian sprite must contain eight separate transparent figures; found',components.length,image.src);return []}
 const order=new Uint16Array(label+1);components.forEach((c,i)=>order[c.label]=i+1);
 for(let i=0;i<count;i++)labels[i]=order[labels[i]]||0;
 const additions=new Uint16Array(count);
 for(let pass=0;pass<6;pass++){additions.fill(0);for(let i=0;i<count;i++){if(labels[i]||!pixels[i*4+3])continue;const x=i%w,y=(i/w)|0;let owner=0,conflict=false;for(let dy=-1;dy<=1&&!conflict;dy++){const ny=y+dy;if(ny<0||ny>=h)continue;for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx;if(nx<0||nx>=w)continue;const near=labels[ny*w+nx];if(!near)continue;if(owner&&owner!==near){conflict=true;break}owner=near}}if(owner&&!conflict)additions[i]=owner}for(let i=0;i<count;i++)if(additions[i])labels[i]=additions[i]}
 const bounds=Array.from({length:8},()=>({minX:w,minY:h,maxX:0,maxY:0}));
 for(let i=0;i<count;i++){const owner=labels[i];if(!owner)continue;const x=i%w,y=(i/w)|0,b=bounds[owner-1];b.minX=Math.min(b.minX,x);b.maxX=Math.max(b.maxX,x);b.minY=Math.min(b.minY,y);b.maxY=Math.max(b.maxY,y)}
 return bounds.map((b,index)=>{const fw=b.maxX-b.minX+1,fh=b.maxY-b.minY+1,fc=document.createElement('canvas');fc.width=fw;fc.height=fh;const fx=fc.getContext('2d'),fd=fx.createImageData(fw,fh);
 for(let y=b.minY;y<=b.maxY;y++)for(let x=b.minX;x<=b.maxX;x++){const si=y*w+x;if(labels[si]!==index+1)continue;const so=si*4,to=((y-b.minY)*fw+x-b.minX)*4;for(let k=0;k<4;k++)fd.data[to+k]=pixels[so+k]}

}
crowdSprites.forEach((im,i)=>{const extract=()=>{crowdFrames[i]=extractPedestrianFrames(im)};im.addEventListener('load',extract,{once:true});if(im.complete&&im.naturalWidth)extract()});
// All walkers share the hero's pavement baseline and apparent height.
// Their motion is independent of player input and camera direction.
const crowdRandom=n=>{const x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};
const pedestrians=Array.from({length:30},(_,i)=>({type:i%5,phase:(i+crowdRandom(i+31)*.72)/30,speed:19+crowdRandom(i+71)*24,step:crowdRandom(i+111)*8,flip:i%5===4}));
function drawPedestrians(time){
 const t=time*.001,heroHeight=Math.max(81.648,Math.min(161.595,height*.1828575)),feetY=height*.845+18;
 pedestrians.forEach((p,i)=>{
  const frames=crowdFrames[p.type];if(!frames.length)return;
  const f=frames[Math.floor(t*(6.5+p.speed*.025)+p.step)%frames.length];
  const range=width+heroHeight*2,worldTravel=t*p.speed+p.phase*range+(p.flip?camera:-camera),travel=((worldTravel%range)+range)%range;
  const x=p.flip?width+heroHeight-travel:travel-heroHeight;
  const scale=heroHeight*1.15/Math.max(1,f.height);
  ctx.save();ctx.translate(x,0);
  if(p.type===3||p.type===4)ctx.filter='brightness(0.5)';
  ctx.drawImage(f.image,-f.anchorX*scale,feetY-f.anchorY*scale,f.width*scale,f.height*scale);
  ctx.restore();
 });
}
function direction(){return((keyboard.has('ArrowRight')||keyboard.has('d')||keyboard.has('D'))?1:0)-((keyboard.has('ArrowLeft')||keyboard.has('a')||keyboard.has('A'))?1:0)||pointerDirection}

const ATMOSPHERE={color:'8,24,49',opacity:0.38};
function drawAtmosphere(){ctx.save();ctx.fillStyle=`rgba(${ATMOSPHERE.color},${ATMOSPHERE.opacity})`;ctx.fillRect(0,0,width,height);ctx.restore()}
// V20: one world-anchored warm lighting audition. Values are deliberately adjustable.
const STREETLIGHT={worldX:850,radius:235,strength:.38,color:'255,181,99',anchored:false};
// Locate a real bright architectural feature in the first background image,
// rather than assuming the original audition coordinate is a lamp.
function anchorStreetlight(){
 const im=scenes[0];if(!im.complete||!im.naturalWidth||!width||!height)return;
 const sample=document.createElement('canvas');sample.width=180;sample.height=90;
 const s=sample.getContext('2d',{willReadFrequently:true});s.drawImage(im,0,0,180,90);
 const data=s.getImageData(0,0,180,90).data;
 const worldScale=height/im.naturalHeight;
 const target=850/(im.naturalWidth*worldScale)*180;
 let best=-Infinity,bx=-1,by=-1;
 for(let y=17;y<58;y+=2)for(let x=10;x<170;x+=2){
  let bright=0;
  for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){
   const ix=x+dx,iy=y+dy;if(ix<0||ix>=180||iy<0||iy>=90)continue;
   const k=(iy*180+ix)*4,r=data[k],g=data[k+1],b=data[k+2];
   const lum=.2126*r+.7152*g+.0722*b;
   if(lum>145)bright+=(lum-145)/110;
  }
  const score=bright-Math.abs(x-target)*.10;
  if(score>best){best=score;bx=x;by=y}
 }
 if(best>5){STREETLIGHT.worldX=bx/180*im.naturalWidth*worldScale;STREETLIGHT.anchored=true}
 else console.warn('V21: no reliable bright feature found; retaining approved V20 light position');
}

function drawStreetlight(){
 if(!STREETLIGHT.anchored&&scenes[0].complete&&scenes[0].naturalWidth)anchorStreetlight();
 const x=STREETLIGHT.worldX-camera;
 if(x < -STREETLIGHT.radius || x > width+STREETLIGHT.radius)return;
 const y=height*.79,r=STREETLIGHT.radius;
 ctx.save();
 // The broad halo reaches characters as they cross the pool of light.
 ctx.globalCompositeOperation='screen';
 const halo=ctx.createRadialGradient(x,y-r*.22,0,x,y-r*.22,r);
 halo.addColorStop(0,`rgba(${STREETLIGHT.color},${STREETLIGHT.strength})`);
 halo.addColorStop(.38,`rgba(${STREETLIGHT.color},${STREETLIGHT.strength*.42})`);
 halo.addColorStop(1,`rgba(${STREETLIGHT.color},0)`);
 ctx.fillStyle=halo;ctx.fillRect(x-r,y-r*1.22,r*2,r*2);
 // A narrower, soft pool grounds the illumination on the sidewalk.
 ctx.translate(x,height*.88);ctx.scale(1,.22);
 const pool=ctx.createRadialGradient(0,0,0,0,0,r*.9);
 pool.addColorStop(0,'rgba(255,181,99,.27)');
 pool.addColorStop(1,'rgba(255,181,99,0)');
 ctx.fillStyle=pool;ctx.beginPath();ctx.arc(0,0,r*.9,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
const bloomMaps=scenes.map(()=>null);
function drawBloom(sw){
 ctx.save();ctx.globalCompositeOperation='screen';let left=-camera;
 scenes.forEach((im,i)=>{
  if(im.complete&&im.naturalWidth){
   if(!bloomMaps[i]){
    const c=document.createElement('canvas');c.width=240;c.height=Math.round(240*im.naturalHeight/im.naturalWidth);
    const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(im,0,0,c.width,c.height);
    const d=g.getImageData(0,0,c.width,c.height);
    for(let j=0;j<d.data.length;j+=4){
     const r=d.data[j],green=d.data[j+1],blue=d.data[j+2];
     const luminance=.2126*r+.7152*green+.0722*blue;
     const peak=Math.max(r,green,blue),floor=Math.min(r,green,blue);
     const chroma=peak-floor;
     const strength=Math.max(0,Math.min(1,Math.max((luminance-150)/80,(peak-155)/95*Math.min(1,chroma/85))));
     d.data[j+3]=Math.round(205*strength);
     if(chroma>22){const boost=Math.min(1.9,1+chroma/170);d.data[j]=Math.min(255,Math.round(r*boost));d.data[j+1]=Math.min(255,Math.round(green*boost));d.data[j+2]=Math.min(255,Math.round(blue*boost));}
    }
    g.putImageData(d,0,0);
    const blur=document.createElement('canvas');blur.width=c.width;blur.height=c.height;
    const bg=blur.getContext('2d');bg.filter='blur(4px)';bg.drawImage(c,0,0);
    bloomMaps[i]={blur,core:c};
   }
   if(left+sw[i]>0&&left<width){
    ctx.globalAlpha=.95;ctx.drawImage(bloomMaps[i].blur,left,0,sw[i],height);
    // Restore crisp original sign lettering over the halo, still behind actors.
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=.9;ctx.drawImage(bloomMaps[i].core,left,0,sw[i],height);
    ctx.globalCompositeOperation='screen';
   }
  }
  left+=sw[i];
 });ctx.restore();
}
function tick(time){const dt=Math.min((time-lastTime)/1000||0,.05);lastTime=time;const dir=direction();const sh=scenes.find(i=>i.naturalHeight)?.naturalHeight||724,scale=height/sh,sw=scenes.map(i=>(i.naturalWidth||2172)*scale),total=sw.reduce((a,b)=>a+b,0),speed=Math.max(165,Math.min(230,height*.24));camera=Math.max(0,Math.min(Math.max(0,total-width),camera+dir*speed*dt));if(dir)walkClock+=dt*10;ctx.fillStyle='#02050b';ctx.fillRect(0,0,width,height);let x=-camera;scenes.forEach((im,i)=>{if(im.complete&&im.naturalWidth)ctx.drawImage(im,x,0,sw[i],height);else{ctx.fillStyle='#080c18';ctx.fillRect(x,0,sw[i],height)}x+=sw[i]});
drawAtmosphere();drawBloom(sw);drawStreetlight();
if(frames.length){const f=frames[dir?Math.floor(walkClock)%frames.length:1],heroHeight=Math.max(81.648,Math.min(161.595,height*.1828575)),s=heroHeight/390,heroX=Math.min(width*.4,width-74),feetY=height*.845+18;ctx.save();ctx.translate(heroX,0);if(dir<0)ctx.scale(-1,1);ctx.drawImage(f.image,-f.anchorX*s,feetY-f.anchorY*s,f.width*s,f.height*s);ctx.restore()}drawPedestrians(time);requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
