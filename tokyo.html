<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>The Impossible Atlas · Tokyo</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050b;color:#fff;font-family:system-ui}canvas{display:block;width:100vw;height:100dvh;touch-action:none;image-rendering:auto}.hint{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);left:0;right:0;text-align:center;font-size:12px;letter-spacing:.16em;color:#f4e3b3;text-shadow:0 2px 8px #000;pointer-events:none;opacity:.8}.badge{position:fixed;top:calc(env(safe-area-inset-top) + 12px);left:14px;font-size:10px;letter-spacing:.15em;color:#fff9;text-shadow:0 2px 6px #000}</style></head><body><canvas id="game"></canvas><div class="badge">THE IMPOSSIBLE ATLAS · TOKYO</div><div class="hint">HOLD RIGHT OR LEFT TO WALK · ← →</div><script>
const ROOT='assets/tokyo-scenes/';const paths=[ROOT+'FFC4A81F-57E3-4153-8242-4DBB5DF6AAF4.png',ROOT+'745F0F74-D425-4FFD-8E82-FD3DA2F35910.png'];const spritePath=ROOT+'9E8C5BA0-F636-4EF0-9E4F-FDF7908A3827.png';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const images=paths.map(src=>{const i=new Image();i.src=src;return i});const sprite=new Image();sprite.src=spritePath;
let W=0,H=0,dpr=1,pos=0,walk=0,dir=0,frame=0,last=0;const keyboard=new Set();let pointerDir=0;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
addEventListener('keydown',e=>{if(['ArrowRight','ArrowLeft','a','d','A','D'].includes(e.key)){e.preventDefault();keyboard.add(e.key)}});addEventListener('keyup',e=>keyboard.delete(e.key));function point(e){pointerDir=e.clientX<W/2?-1:1;try{canvas.setPointerCapture(e.pointerId)}catch{}}canvas.addEventListener('pointerdown',point);canvas.addEventListener('pointerup',()=>pointerDir=0);canvas.addEventListener('pointercancel',()=>pointerDir=0);
function tick(t){let dt=Math.min((t-last)/1000||0,.05);last=t;let direction=(keyboard.has('ArrowRight')||keyboard.has('d')||keyboard.has('D')?1:0)-(keyboard.has('ArrowLeft')||keyboard.has('a')||keyboard.has('A')?1:0);dir=direction||pointerDir;ctx.clearRect(0,0,W,H);
const iw=2172,ih=724;const scale=H/ih;const sceneWidths=images.map(im=>(im.naturalWidth||iw)*scale);const total=sceneWidths.reduce((a,b)=>a+b,0);const speed=145;pos=Math.max(0,Math.min(total-W,pos+dir*speed*dt));if(dir)walk+=dt*9;const camera=pos;let x=-camera;for(let n=0;n<images.length;n++){const im=images[n],width=sceneWidths[n];if(im.complete&&im.naturalWidth){ctx.drawImage(im,x,0,width,H)}else{ctx.fillStyle='#080c18';ctx.fillRect(x,0,width,H)}x+=width}
if(sprite.complete&&sprite.naturalWidth){const cols=8,rows=2;const sw=sprite.naturalWidth/cols,sh=sprite.naturalHeight/rows;const f=dir?Math.floor(walk)%16:0;const spriteHeight=Math.max(68,Math.min(96,H*.095));const spriteWidth=spriteHeight*sw/sh;const px=Math.min(W*.43,W-90),feet=H*.83;ctx.save();if(dir<0){ctx.translate(px*2+spriteWidth,0);ctx.scale(-1,1)}ctx.drawImage(sprite,(f%cols)*sw,Math.floor(f/cols)*sh,sw,sh,px,feet-spriteHeight,spriteWidth,spriteHeight);ctx.restore()}
requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
