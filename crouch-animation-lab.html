<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Crouch Animation Lab</title><style>*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}body{margin:0;background:#080e18;color:#f0e5ce;font:14px system-ui}header{padding:14px}h2{margin:0;font-size:18px}p{color:#a6b9c8;margin:6px 0}canvas{width:100%;height:50vh;min-height:260px;display:block;background:linear-gradient(#142035,#090e17)}section{padding:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{font:700 15px system-ui;background:#293d51;color:white;border:1px solid #7a90a6;border-radius:10px;padding:14px 24px;touch-action:none}button{ -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}button:active{background:#556b7d}#status{padding:10px;color:#c9b78c;text-align:center}</style></head><body><header><h2>OPEN AnI · CROUCH ANIMATION LAB V4</h2><p>Original walking hero + separate entrance-sheet crouch animation. Hold CROUCH to test, release to stand. No game changes.</p></header><canvas id="stage"></canvas><section><button id="left">◀ WALK</button><button id="crouch">HOLD CROUCH</button><button id="right">WALK ▶</button></section><div id="status">Loading existing assets…</div><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');let down={},time=0,x=300,last=0,ready=false,walk=[],crouch=[],walkSource,cs;
const entrancePath='assets/7A7F12BE-E094-4EA1-ACDD-8A203F705564.png';const heroPath='assets/tokyo-scenes/9E8C5BA0-F636-4EF0-9E4F-FDF7908A3827.png',crouchPath='assets/EA36105F-5A86-42A6-ACF1-3BF8A4DF043E.png';
function load(url){return new Promise((ok,fail)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=fail;i.src=url})}
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=canvas.clientWidth*d;canvas.height=canvas.clientHeight*d;ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
function cut(img,l,r){const c=document.createElement('canvas');c.width=r-l;c.height=img.height;c.getContext('2d').drawImage(img,l,0,r-l,img.height,0,0,r-l,img.height);return c}
function extractSpriteFrames(image){
const source=document.createElement('canvas');source.width=image.naturalWidth;source.height=image.naturalHeight;const sc=source.getContext('2d',{willReadFrequently:true});sc.drawImage(image,0,0);const pixels=sc.getImageData(0,0,source.width,source.height).data;const w=source.width,h=source.height,count=w*h,labels=new Uint16Array(count),queue=new Uint32Array(count),components=[];const threshold=32;let label=0;
for(let start=0;start<count;start++){if(labels[start]||pixels[start*4+3]<=threshold)continue;label++;let head=0,tail=0,area=0,minX=w,minY=h,maxX=0,maxY=0;labels[start]=label;queue[tail++]=start;
while(head<tail){const i=queue[head++],x=i%w,y=(i/w)|0;area++;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);for(let dy=-1;dy<=1;dy++){const ny=y+dy;if(ny<0||ny>=h)continue;for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx;if(nx<0||nx>=w)continue;const ni=ny*w+nx;if(!labels[ni]&&pixels[ni*4+3]>threshold){labels[ni]=label;queue[tail++]=ni}}}}if(area>10000)components.push({label,minX,minY,maxX,maxY})}
components.sort((a,b)=>(a.minY<h/2?0:1)-(b.minY<h/2?0:1)||a.minX-b.minX);if(components.length!==16){console.error('Expected 16 figures, found',components.length);return []}
const order=new Uint16Array(label+1);components.forEach((c,i)=>order[c.label]=i+1);for(let i=0;i<count;i++)labels[i]=order[labels[i]]||0;
const additions=new Uint16Array(count);for(let pass=0;pass<6;pass++){additions.fill(0);for(let i=0;i<count;i++){if(labels[i]||!pixels[i*4+3])continue;const x=i%w,y=(i/w)|0;let owner=0,conflict=false;for(let dy=-1;dy<=1&&!conflict;dy++){const ny=y+dy;if(ny<0||ny>=h)continue;for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx;if(nx<0||nx>=w)continue;const near=labels[ny*w+nx];if(!near)continue;if(owner&&owner!==near){conflict=true;break}owner=near}}if(owner&&!conflict)additions[i]=owner}for(let i=0;i<count;i++)if(additions[i])labels[i]=additions[i]}
const bounds=Array.from({length:16},()=>({minX:w,minY:h,maxX:0,maxY:0}));for(let i=0;i<count;i++){const owner=labels[i];if(!owner)continue;const x=i%w,y=(i/w)|0,b=bounds[owner-1];b.minX=Math.min(b.minX,x);b.maxX=Math.max(b.maxX,x);b.minY=Math.min(b.minY,y);b.maxY=Math.max(b.maxY,y)}
return bounds.map((b,frameIndex)=>{const fw=b.maxX-b.minX+1,fh=b.maxY-b.minY+1,fc=document.createElement('canvas');fc.width=fw;fc.height=fh;const fx=fc.getContext('2d'),fd=fx.createImageData(fw,fh);let weight=0,hoodX=0;for(let y=b.minY;y<=b.maxY;y++)for(let x=b.minX;x<=b.maxX;x++){const si=y*w+x;if(labels[si]!==frameIndex+1)continue;const so=si*4,to=((y-b.minY)*fw+x-b.minX)*4;for(let k=0;k<4;k++)fd.data[to+k]=pixels[so+k];if(y<=b.minY+fh*.28&&pixels[so+3]>threshold){hoodX+=(x-b.minX)*pixels[so+3];weight+=pixels[so+3]}}fx.putImageData(fd,0,0);return{image:fc,width:fw,height:fh,anchorX:weight?hoodX/weight:fw/2,anchorY:fh}})}


function extractEntranceFrames(img){
 const w=img.naturalWidth,h=img.naturalHeight;
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;
 const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0);
 const d=cx.getImageData(0,0,w,h).data;
 const rows=new Float64Array(h);
 for(let y=0;y<h;y++){let count=0;for(let x=0;x<w;x+=2)if(d[(y*w+x)*4+3]>30)count++;rows[y]=count}
 const bands=[];let active=false,begin=0;
 for(let y=0;y<=h;y++){const on=y<h&&rows[y]>w*.008;if(on&&!active){begin=y;active=true}if(!on&&active){if(y-begin>h*.05)bands.push([begin,y]);active=false}}
 // The crouch poses occupy the bottom animation row of the entrance sheet.
 // Find row from real alpha pixels, then locate the five lowest-occupancy gutters.
 if(bands.length<3)throw Error('Entrance sheet has '+bands.length+' detectable pose rows');
 const [top,bottom]=bands[bands.length-1],occ=new Float64Array(w);
 for(let x=0;x<w;x++){let n=0;for(let y=top;y<bottom;y++)if(d[(y*w+x)*4+3]>30)n++;occ[x]=n}
 const runs=[];let on=false,l=0;
 for(let x=0;x<=w;x++){const filled=x<w&&occ[x]>0;if(filled&&!on){l=x;on=true}if(!filled&&on){runs.push([l,x]);on=false}}
 // Separate at the five widest actual transparent gutters, rather than equal-width slicing.
 const gaps=[];for(let i=0;i<runs.length-1;i++)gaps.push({index:i,width:runs[i+1][0]-runs[i][1]});
 gaps.sort((a,b)=>b.width-a.width);
 if(gaps.length<5)throw Error('Only '+gaps.length+' pose gaps found');
 const splits=gaps.slice(0,5).map(v=>v.index).sort((a,b)=>a-b);
 const chunks=[];let first=0;for(const ix of splits){chunks.push([runs[first][0],runs[ix][1]]);first=ix+1}chunks.push([runs[first][0],runs[runs.length-1][1]]);
 const crouch=chunks.map(([x0,x1])=>{let minX=x1,minY=bottom,maxX=x0,maxY=top;for(let y=top;y<bottom;y++)for(let x=x0;x<x1;x++)if(d[(y*w+x)*4+3]>30){minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y)}
 const width=maxX-minX+1,height=maxY-minY+1,frame=document.createElement('canvas');frame.width=width;frame.height=height;frame.getContext('2d').drawImage(img,minX,minY,width,height,0,0,width,height);return{image:frame,width,height}});
 return{crouch};
}
Promise.all([load(heroPath),load(entrancePath)]).then(([h,c])=>{walkSource=h;cs=c;walk=extractSpriteFrames(h);if(walk.length!==16)throw Error('Hero sheet extraction returned '+walk.length+' frames');const extracted=extractEntranceFrames(c);if(!extracted||extracted.crouch.length!==6)throw Error('Could not isolate 6 entrance crouch frames');crouch=extracted.crouch.map(f=>f.image);ready=true;status.textContent='Assets loaded · 16 walking frames + 6 TRUE crouch frames · hold CROUCH to preview'}).catch(e=>status.textContent='Animation extraction error: '+e);
for(const id of ['left','right','crouch']){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);down[id]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>down[id]=false)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')down.left=true;if(e.key==='ArrowRight')down.right=true;if(e.key==='ArrowDown')down.crouch=true});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')down.left=false;if(e.key==='ArrowRight')down.right=false;if(e.key==='ArrowDown')down.crouch=false});
function draw(now){const dt=Math.min(.05,(now-last)/1000||.016);last=now;time+=dt;const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);const ground=h*.79;ctx.fillStyle='#17293b';ctx.fillRect(0,ground,w,h-ground);ctx.fillStyle='#45606a';ctx.fillRect(0,ground,w,5);for(let i=0;i<w;i+=60){ctx.fillStyle='#243f4d';ctx.fillRect(i,ground+25,35,3)}if(ready){x=Math.max(40,Math.min(w-40,x+((down.right?1:0)-(down.left?1:0))*dt*w*.35));let frame,scale;if(down.crouch){frame=crouch[Math.floor(time*8)%6];scale=Math.min(h*.38/frame.height,w*.22/frame.width)}else{frame=walk[(down.left||down.right)?Math.floor(time*9)%walk.length:1].image;scale=Math.min(h*.44/frame.height,w*.24/frame.width)}ctx.save();ctx.translate(x,ground);if(down.left)ctx.scale(-1,1);ctx.drawImage(frame,-frame.width*scale/2,-frame.height*scale,frame.width*scale,frame.height*scale);ctx.restore()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
