<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Crouch Animation Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#080e18;color:#f0e5ce;font:14px system-ui}header{padding:14px}h2{margin:0;font-size:18px}p{color:#a6b9c8;margin:6px 0}canvas{width:100%;height:50vh;min-height:260px;display:block;background:linear-gradient(#142035,#090e17)}section{padding:12px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button{font:700 15px system-ui;background:#293d51;color:white;border:1px solid #7a90a6;border-radius:10px;padding:14px 24px;touch-action:none}button:active{background:#556b7d}#status{padding:10px;color:#c9b78c;text-align:center}</style></head><body><header><h2>OPEN AnI · CROUCH ANIMATION LAB V1</h2><p>Existing original hero + six-frame crouch sprite sheet. Hold CROUCH to test, release to stand. No game changes.</p></header><canvas id="stage"></canvas><section><button id="left">◀ WALK</button><button id="crouch">HOLD CROUCH</button><button id="right">WALK ▶</button></section><div id="status">Loading existing assets…</div><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.querySelector('#status');let down={},time=0,x=300,last=0,ready=false,walk=[],crouch=[],walkSource,cs;
const heroPath='assets/tokyo-scenes/9E8C5BA0-F636-4EF0-9E4F-FDF7908A3827.png',crouchPath='assets/EA36105F-5A86-42A6-ACF1-3BF8A4DF043E.png';
function load(url){return new Promise((ok,fail)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=fail;i.src=url})}
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=canvas.clientWidth*d;canvas.height=canvas.clientHeight*d;ctx.imageSmoothingEnabled=false}addEventListener('resize',resize);resize();
function cut(img,l,r){const c=document.createElement('canvas');c.width=r-l;c.height=img.height;c.getContext('2d').drawImage(img,l,0,r-l,img.height,0,0,r-l,img.height);return c}
Promise.all([load(heroPath),load(crouchPath)]).then(([h,c])=>{walkSource=h;cs=c;const seams=[0,228,424,754,1110,1330,1536].map(v=>Math.round(v*c.width/1536));for(let i=0;i<6;i++)crouch.push(cut(c,seams[i],seams[i+1]));ready=true;status.textContent='Assets loaded · crouch frames: 6 · hold CROUCH to preview'}).catch(e=>status.textContent='Asset failed to load: '+e);
for(const id of ['left','right','crouch']){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);down[id]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>down[id]=false)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')down.left=true;if(e.key==='ArrowRight')down.right=true;if(e.key==='ArrowDown')down.crouch=true});document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')down.left=false;if(e.key==='ArrowRight')down.right=false;if(e.key==='ArrowDown')down.crouch=false});
function draw(now){const dt=Math.min(.05,(now-last)/1000||.016);last=now;time+=dt;const w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);const ground=h*.79;ctx.fillStyle='#17293b';ctx.fillRect(0,ground,w,h-ground);ctx.fillStyle='#45606a';ctx.fillRect(0,ground,w,5);for(let i=0;i<w;i+=60){ctx.fillStyle='#243f4d';ctx.fillRect(i,ground+25,35,3)}if(ready){x=Math.max(40,Math.min(w-40,x+((down.right?1:0)-(down.left?1:0))*dt*w*.35));let frame,scale;if(down.crouch){frame=crouch[Math.floor(time*8)%6];scale=Math.min(h*.38/frame.height,w*.22/frame.width)}else{frame=walkSource;scale=Math.min(h*.44/frame.height,w*.24/frame.width)}ctx.save();ctx.translate(x,ground);if(down.left)ctx.scale(-1,1);ctx.drawImage(frame,-frame.width*scale/2,-frame.height*scale,frame.width*scale,frame.height*scale);ctx.restore()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
