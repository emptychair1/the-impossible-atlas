<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>The Impossible Atlas | Character Animation Lab</title><style>body{margin:0;background:#090f1c;color:#e9ecff;font:15px system-ui}header{padding:12px 16px}h2{margin:0 0 4px;font-size:18px}p{margin:0;color:#a8b6cb}#game{width:100%;max-width:980px;margin:auto;touch-action:none}canvas{display:block;width:100%}nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px}button{background:#1d3048;color:white;border:1px solid #53708a;border-radius:10px;padding:12px 18px;font-weight:bold}button:active{background:#4b5d79}small{display:block;text-align:center;color:#a8b6cb}#status{padding:8px 16px;color:#c6d5e8}</style></head><body><header><h2>THE IMPOSSIBLE ATLAS · Character Animation Lab · v3</h2><p>Protagonist + Open AnI guard + Doberman. Isolated test, Tokyo untouched.</p></header><div id="status">Loading Pixel Lab exports…</div><div id="game"></div><nav><button data-act="left">◀ Walk</button><button data-act="right">Walk ▶</button><button data-act="run">RUN</button><button data-act="crouch">CROUCH</button></nav><small>Keyboard: ← → move · Shift run · ↓ crouch. Touch: hold buttons.</small><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>
(async()=>{
const specs=[
{zip:'Detailed_cinematic_pixel-Idle.zip',sets:{idle:['Idle/rotations/east.png'],walk:Array.from({length:8},(_,i)=>'Idle/animations/Walking/east/frame_'+String(i).padStart(3,'0')+'.png')}},
{zip:'Detailed_cinematic_pixel-Idle_copy.zip',sets:{run:Array.from({length:8},(_,i)=>'Idle_copy/animations/Running/east/frame_'+String(i).padStart(3,'0')+'.png')}},
{zip:'Detailed_cinematic_pixel-Idle_copy_2.zip',sets:{crouch:Array.from({length:5},(_,i)=>'Idle_copy_2/animations/Crouching/south-east/frame_'+String(i).padStart(3,'0')+'.png')}},
{zip:'a_private_security_guard-Idle.zip',sets:{guardidle:['Idle/rotations/east.png'],guardwalk:Array.from({length:6},(_,i)=>'Idle/animations/Walk/east/frame_'+String(i).padStart(3,'0')+'.png')}},
{zip:'doberman_security_guard-Idle.zip',sets:{dogidle:['Idle/rotations/east.png'],dogrun:Array.from({length:8},(_,i)=>'Idle/animations/Run/east/frame_'+String(i).padStart(3,'0')+'.png')}}
];
const data={};const urls=[];for(const spec of specs){const url='https://raw.githubusercontent.com/emptychair1/the-impossible-atlas/main/assets/'+encodeURIComponent(spec.zip);const response=await fetch(url);if(!response.ok)throw Error(spec.zip+': HTTP '+response.status);const archive=await JSZip.loadAsync(await response.arrayBuffer());for(const [key,paths] of Object.entries(spec.sets)){data[key]=[];for(const path of paths){const file=archive.file(path);if(!file)throw Error('Missing '+path+' in '+spec.zip);const blob=new Blob([await file.async('uint8array')],{type:'image/png'});const objectURL=URL.createObjectURL(blob);urls.push(objectURL);data[key].push(objectURL)}}}
document.getElementById('status').textContent='All three characters loaded · '+Object.values(data).reduce((n,x)=>n+x.length,0)+' original PNG frames';
let held=new Set();document.querySelectorAll('button').forEach(b=>{const k=b.dataset.act;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);held.add(k)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>held.delete(k))});
let hero,guard,dog,dogLabel,label,keys,ground=445;
new Phaser.Game({type:Phaser.AUTO,parent:'game',width:900,height:530,backgroundColor:'#101a2c',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},pixelArt:true,scene:{preload,create,update}});
function preload(){for(const [key,files] of Object.entries(data))files.forEach((file,i)=>this.load.image(key+'_'+i,file))}
function create(){let g=this.add.graphics();g.fillStyle(0x142840);g.fillRect(0,0,900,ground);for(let x=0;x<900;x+=75){g.lineStyle(1,0x29475c,.6);g.lineBetween(x,40,x,ground)}g.fillStyle(0x293f50);g.fillRect(0,ground,900,85);g.lineStyle(3,0x8aa2ad,.7);g.lineBetween(0,ground,900,ground);this.add.text(35,36,'PROTAGONIST',{fontSize:'17px',color:'#d8c27b'});this.add.text(610,36,'OPEN AnI SECURITY',{fontSize:'17px',color:'#d6a0a0'});for(const [name,frames,rate] of [['idle',1,1],['walk',8,9],['run',8,13],['crouch',5,7],['guardidle',1,1],['guardwalk',6,8],['dogidle',1,1],['dogrun',8,12]])this.anims.create({key:name,frames:Array.from({length:frames},(_,i)=>({key:name+'_'+i})),frameRate:rate,repeat:-1});hero=this.add.sprite(220,ground,'idle_0').setOrigin(.5,1).setScale(3);guard=this.add.sprite(690,ground,'guardwalk_0').setOrigin(.5,1).setScale(3);dog=this.add.sprite(695,ground,'dogidle_0').setOrigin(.5,1).setScale(2.7);hero.play('idle');guard.play('guardwalk');dog.play('dogidle');dogLabel=this.add.text(610,75,'K-9 · IDLE',{fontSize:'15px',color:'#c6d5e8'});keys=this.input.keyboard.addKeys('LEFT,RIGHT,SHIFT,DOWN,A,D,S');label=this.add.text(35,75,'IDLE',{fontSize:'15px',color:'#c6d5e8'});this.add.text(35,490,'ORIGINAL PIXEL LAB PNG FRAMES · FOOT-ANCHORED · TOKYO UNCHANGED',{fontSize:'12px',color:'#a0b0c0'});this.dogRunning=false}
function update(t,dt){let left=held.has('left')||keys.LEFT.isDown||keys.A.isDown,right=held.has('right')||keys.RIGHT.isDown||keys.D.isDown,run=held.has('run')||keys.SHIFT.isDown,crouch=held.has('crouch')||keys.DOWN.isDown||keys.S.isDown;let state=crouch?'crouch':(left||right)?(run?'run':'walk'):'idle';if(hero.anims.currentAnim?.key!==state)hero.play(state);if(left||right){hero.x=Phaser.Math.Clamp(hero.x+(right?1:-1)*(run?210:105)*dt/1000,55,845);hero.setFlipX(left)}label.setText(state.toUpperCase()+(state==='crouch'?' · southeast art':''));guard.x=690+Math.sin(t/1200)*95;guard.setFlipX(Math.cos(t/1200)<0);let dogRunning=Math.floor(t/3200)%2===1;if(dogRunning!==this.dogRunning){this.dogRunning=dogRunning;dog.play(dogRunning?'dogrun':'dogidle');dogLabel.setText('K-9 · '+(dogRunning?'RUN':'IDLE'))}dog.x=dogRunning?695+Math.sin(t/480)*85:695;dog.setFlipX(dogRunning&&Math.cos(t/480)<0)}
})().catch(e=>{document.getElementById('status').textContent='Lab loading error: '+e.message;document.getElementById('status').style.color='#ff8c8c';console.error(e)});</script></body></html>
