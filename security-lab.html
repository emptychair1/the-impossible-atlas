<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tokyo Security Hardware Audition</title><style>*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf1ff;font:14px system-ui}header{padding:14px}h1{font-size:20px;margin:0}small{color:#aab7c8}.stage{position:relative;margin:0 10px;border:1px solid #495771;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;touch-action:none}.panel{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}label{color:#b9c9dd}label strong{float:right;color:#fca4b0}input{width:100%;accent-color:#ff3857}.actions{display:flex;gap:8px;padding:0 12px 16px;flex-wrap:wrap}button{padding:11px 13px;border:1px solid #677995;border-radius:10px;background:#243550;color:white;font-weight:700}p{padding:0 12px;color:#b6c7dc}pre{margin:0 12px 18px;padding:10px;background:#121e30;white-space:pre-wrap;border-radius:8px;font-size:11px}</style></head><body><header><h1>🔴 Tokyo Security Audition</h1><small>V1 · Two real-time Phaser-free canvas prototypes · Original corridor untouched</small></header><div class="stage"><canvas id="c" width="800" height="480"></canvas></div><p>Left: wall-to-wall tripwire. Right: motorized sweeping scanner. Both animate, pulse, spark and reflect on the wet floor.</p><div class="panel" id="sliders"></div><div class="actions"><button id="pause">Pause motion</button><button id="copy">Copy settings</button><button id="reset">Reset</button></div><pre id="settings"></pre><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),fields=[['beam','Beam brightness',90,10,100],['glow','Glow radius',55,0,100],['speed','Scanner speed',50,0,100],['height','Tripwire height',180,80,300],['angle','Sweep angle',45,5,80],['reflection','Floor reflection',65,0,100]],v=Object.fromEntries(fields.map(x=>[x[0],x[2]]));let t=0,paused=false,last=0,bg;
for(const [key,label,initial,min,max] of fields){const el=document.createElement('label');el.innerHTML=label+'<strong id="val-'+key+'">'+initial+'</strong><input id="range-'+key+'" type="range" min="'+min+'" max="'+max+'" value="'+initial+'">';document.getElementById('sliders').append(el);el.querySelector('input').oninput=e=>{v[key]=+e.target.value;el.querySelector('strong').textContent=v[key];out()}}
function out(){document.getElementById('settings').textContent=JSON.stringify(v,null,2)}
function line(x,y,X,Y,brightness=1){ctx.save();ctx.globalCompositeOperation='screen';const power=v.beam/100*brightness;for(const [width,alpha,color] of [[34,v.glow/100*.08,'#fa001d'],[16,v.glow/100*.22,'#ff1639'],[6,.65,'#ff315a'],[2,.96,'#ffe7ec']]){ctx.strokeStyle=color;ctx.globalAlpha=alpha*power;ctx.lineWidth=width;ctx.lineCap='round';ctx.shadowBlur=width*1.7;ctx.shadowColor='#ff1739';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}ctx.restore()}
function device(x,y,side=1){ctx.save();ctx.translate(x,y);ctx.scale(side,1);ctx.shadowColor='#ff253f';ctx.shadowBlur=18;ctx.fillStyle='#111922';ctx.strokeStyle='#566277';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-19,-25,35,50,6);ctx.fill();ctx.stroke();ctx.fillStyle='#263344';ctx.fillRect(-14,-19,23,38);ctx.fillStyle='#ff304e';ctx.fillRect(3,-8,8,16);ctx.fillStyle='#ffbdc4';ctx.fillRect(8,-3,4,6);ctx.restore()}
function draw(){ctx.clearRect(0,0,800,480);ctx.fillStyle='#0b1424';ctx.fillRect(0,0,800,480);if(bg){const ratio=480/bg.height;ctx.drawImage(bg,0,0,bg.width*ratio,480)}ctx.fillStyle='rgba(3,8,17,.4)';ctx.fillRect(0,0,800,480);ctx.fillStyle='#070e18';ctx.fillRect(0,382,800,98);ctx.strokeStyle='#546072';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,382);ctx.lineTo(800,382);ctx.stroke();
ctx.fillStyle='#f5dce0';ctx.font='bold 17px system-ui';ctx.fillText('01  TRIPWIRE',35,39);ctx.fillText('02  SWEEPING SCANNER',422,39);
const y=v.height,flash=.86+.14*Math.sin(t*7);device(55,y);device(340,y,-1);line(70,y,325,y,flash);
const a=(Math.sin(t*(.2+v.speed/100*2))*v.angle)*Math.PI/180;const ox=585,oy=125,len=250,ex=ox+Math.sin(a)*len,ey=oy+Math.cos(a)*len;device(ox,oy);line(ox,oy,ex,ey);
ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=v.reflection/100*.24;for(let k=0;k<8;k++){const yy=395+k*10;ctx.strokeStyle=k%2?'#ff1439':'#a50e2e';ctx.lineWidth=1+((8-k)*.7);ctx.beginPath();ctx.moveTo(65+k*3,yy);ctx.lineTo(330-k*2,yy);ctx.stroke();ctx.beginPath();ctx.moveTo(ex-15-k*4,yy);ctx.lineTo(ex+15+k*4,yy);ctx.stroke()}ctx.restore();
for(let i=0;i<8;i++){const q=t*2+i*2.4,x=70+(q*31)%255,y2=y+Math.sin(q*3)*5;ctx.fillStyle='#ff8390';ctx.globalAlpha=.25+.4*Math.abs(Math.sin(q));ctx.fillRect(x,y2,2,2)}ctx.globalAlpha=1;ctx.fillStyle='#a6b5ca';ctx.font='13px system-ui';ctx.fillText('CROUCH UNDER',120,355);ctx.fillText('TIME THE SWEEP',490,355)}
function loop(now){if(!paused)t+=Math.min(40,now-last||16)/1000;last=now;draw();requestAnimationFrame(loop)}
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Resume motion':'Pause motion'};
document.getElementById('reset').onclick=()=>{for(const [k,,initial] of fields){v[k]=initial;document.getElementById('range-'+k).value=initial;document.getElementById('val-'+k).textContent=initial}out()};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('settings').textContent);document.getElementById('copy').textContent='✓ Copied'}catch(e){document.getElementById('settings').select?.()}};
const image=new Image;image.onload=()=>{bg=image};image.src='/assets/8EF0DC8E-FBF3-4105-A55F-A59882BAFC81.png';out();requestAnimationFrame(loop);
</script></body></html>
