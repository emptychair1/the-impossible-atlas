<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tokyo Security Hardware Audition</title><style>*{box-sizing:border-box}body{margin:0;background:#090d18;color:#eaf1ff;font:14px system-ui}header{padding:14px}h1{font-size:20px;margin:0}small{color:#aab7c8}.stage{position:relative;margin:0 10px;border:1px solid #495771;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;touch-action:none}.panel{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}label{color:#b9c9dd}label strong{float:right;color:#fca4b0}input{width:100%;accent-color:#ff3857}.actions{display:flex;gap:8px;padding:0 12px 16px;flex-wrap:wrap}button{padding:11px 13px;border:1px solid #677995;border-radius:10px;background:#243550;color:white;font-weight:700}p{padding:0 12px;color:#b6c7dc}pre{margin:0 12px 18px;padding:10px;background:#121e30;white-space:pre-wrap;border-radius:8px;font-size:11px}</style></head><body><header><h1>🔴 Tokyo Security Arsenal</h1><small>V3 · 8 animated obstacle auditions · No background artwork · Corridor untouched</small></header><div class="stage"><canvas id="c" width="800" height="480"></canvas></div><p>Swipe or scroll through twelve security concepts. Dark neutral backdrop so we can judge the hardware and beams without scenery.</p><div class="actions" id="picker"></div><div class="panel" id="sliders"></div><div class="actions"><button id="pause">Pause motion</button><button id="copy">Copy settings</button><button id="reset">Reset</button></div><pre id="settings"></pre><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),fields=[['beam','Beam brightness',90,10,100],['glow','Glow radius',55,0,100],['speed','Scanner speed',50,0,100],['height','Tripwire height',180,80,300],['angle','Sweep angle',45,5,80],['reflection','Floor reflection',65,0,100]],v=Object.fromEntries(fields.map(x=>[x[0],x[2]]));let t=0,paused=false,last=0,selected=0;const types=['Tripwire','Vertical laser gate','Laser grid','Rotating crossbeam','Pulse barrier','Floor proximity mines','Security camera cone','Piston crusher'];
for(const [key,label,initial,min,max] of fields){const el=document.createElement('label');el.innerHTML=label+'<strong id="val-'+key+'">'+initial+'</strong><input id="range-'+key+'" type="range" min="'+min+'" max="'+max+'" value="'+initial+'">';document.getElementById('sliders').append(el);el.querySelector('input').oninput=e=>{v[key]=+e.target.value;el.querySelector('strong').textContent=v[key];out()}}
function out(){document.getElementById('settings').textContent=JSON.stringify({obstacle:types[selected],...v},null,2)}
function line(x,y,X,Y,brightness=1){ctx.save();ctx.globalCompositeOperation='screen';const power=v.beam/100*brightness;for(const [width,alpha,color] of [[34,v.glow/100*.08,'#fa001d'],[16,v.glow/100*.22,'#ff1639'],[6,.65,'#ff315a'],[2,.96,'#ffe7ec']]){ctx.strokeStyle=color;ctx.globalAlpha=alpha*power;ctx.lineWidth=width;ctx.lineCap='round';ctx.shadowBlur=width*1.7;ctx.shadowColor='#ff1739';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.stroke()}ctx.restore()}
function device(x,y,side=1){ctx.save();ctx.translate(x,y);ctx.scale(side,1);ctx.shadowColor='#ff253f';ctx.shadowBlur=18;ctx.fillStyle='#111922';ctx.strokeStyle='#566277';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-19,-25,35,50,6);ctx.fill();ctx.stroke();ctx.fillStyle='#263344';ctx.fillRect(-14,-19,23,38);ctx.fillStyle='#ff304e';ctx.fillRect(3,-8,8,16);ctx.fillStyle='#ffbdc4';ctx.fillRect(8,-3,4,6);ctx.restore()}
function draw(){ctx.clearRect(0,0,800,480);ctx.fillStyle='#080c14';ctx.fillRect(0,0,800,480);const gradient=ctx.createLinearGradient(0,0,0,480);gradient.addColorStop(0,'#101827');gradient.addColorStop(1,'#05080e');ctx.fillStyle=gradient;ctx.fillRect(0,0,800,480);ctx.strokeStyle='#1c293b';ctx.lineWidth=1;for(let x=0;x<800;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,480);ctx.stroke()}for(let y=0;y<480;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(800,y);ctx.stroke()}ctx.fillStyle='#fff';ctx.font='bold 22px system-ui';ctx.fillText(String(selected+1).padStart(2,'0')+'  '+types[selected].toUpperCase(),28,42);ctx.font='13px system-ui';ctx.fillStyle='#a8b7c9';ctx.fillText('Concept preview · clean stage · original corridor unaffected',28,65);
const pulse=.75+.25*Math.sin(t*5),floor=392;
ctx.strokeStyle='#40516b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(25,floor);ctx.lineTo(775,floor);ctx.stroke();
switch(selected){
case 0:device(100,240);device(700,240,-1);line(116,240,683,240,pulse);break;

case 1:for(let i=0;i<5;i++){const x=180+i*105;device(x,110);device(x,380,-1);line(x,130,x,362,pulse)}break;

case 2:for(let i=0;i<5;i++){const y=130+i*54;device(105,y);device(695,y,-1);line(120,y,680,y,pulse)}for(let i=0;i<4;i++){const x=220+i*120;line(x,130,x,346,pulse)}break;

case 3:{device(400,235);for(let i=0;i<4;i++){const a=t*(.3+v.speed/100*2)+i*Math.PI/2;line(400,235,400+Math.cos(a)*225,235+Math.sin(a)*175)}break}

case 4:device(95,220);device(705,220,-1);if(Math.sin(t*(1+v.speed/40))>-.15){for(let i=-2;i<=2;i++)line(110,220+i*24,690,220+i*24,pulse)}break;

case 5:for(let i=0;i<5;i++){const x=140+i*130,y=380;ctx.fillStyle='#293342';ctx.fillRect(x-32,y-12,64,12);ctx.fillStyle='#ff3857';ctx.fillRect(x-25,y-10,50,4);for(let j=0;j<5;j++){const px=x+(j-2)*8,py=y-15-14*Math.abs(Math.sin(t*3+i+j));line(px,y-12,px,py,.6)}}break;

case 6:{device(400,105);const x=400+Math.sin(t*.8)*160;ctx.save();ctx.fillStyle='rgba(255,241,202,.24)';ctx.beginPath();ctx.moveTo(400,125);ctx.lineTo(x-130,385);ctx.lineTo(x+130,385);ctx.closePath();ctx.fill();ctx.restore();break}

case 7:{const yy=120+(1+Math.sin(t*(1+v.speed/60)))*90;ctx.fillStyle='#273141';ctx.fillRect(230,85,340,55);ctx.fillStyle='#384458';ctx.fillRect(270,140,260,yy-140);ctx.fillStyle='#ef344c';ctx.fillRect(260,yy,280,12);for(let i=0;i<8;i++)line(275+i*35,yy+12,275+i*35,yy+22,.5);break}
}

ctx.save();ctx.globalAlpha=v.reflection/100*.2;ctx.globalCompositeOperation='screen';for(let i=0;i<9;i++){ctx.strokeStyle='#ff2746';ctx.lineWidth=2+i*.5;ctx.beginPath();ctx.moveTo(160+i*12,407+i*7);ctx.lineTo(640-i*12,407+i*7);ctx.stroke()}ctx.restore();
ctx.fillStyle='#aebcd0';ctx.font='13px system-ui';ctx.fillText('← Previous',28,457);ctx.fillText('Next →',705,457)}
function loop(now){if(!paused)t+=Math.min(40,now-last||16)/1000;last=now;draw();requestAnimationFrame(loop)}
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Resume motion':'Pause motion'};
document.getElementById('reset').onclick=()=>{for(const [k,,initial] of fields){v[k]=initial;document.getElementById('range-'+k).value=initial;document.getElementById('val-'+k).textContent=initial}out()};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(document.getElementById('settings').textContent);document.getElementById('copy').textContent='✓ Copied'}catch(e){document.getElementById('settings').select?.()}};
const picker=document.getElementById('picker');for(let i=0;i<types.length;i++){const b=document.createElement('button');b.textContent=(i+1)+'. '+types[i];b.onclick=()=>{selected=i;out();document.querySelectorAll('#picker button').forEach((x,j)=>x.style.borderColor=j===i?'#ff536e':'#677995')};picker.append(b)}picker.firstChild.click();let sx=0;canvas.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});canvas.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>35){selected=(selected+(d<0?1:types.length-1))%types.length;picker.children[selected].click()}},{passive:true});canvas.addEventListener('click',e=>{selected=(selected+(e.offsetX>canvas.clientWidth/2?1:types.length-1))%types.length;picker.children[selected].click()});out();requestAnimationFrame(loop);
</script></body></html>
